# サイトを GitHub 上でビルドして GitHub Pages に公開する(main に入るたび、または手動実行)。
# リポジトリの Settings → Pages → Build and deployment の Source を「GitHub Actions」にして使う。
# 更新日(sitemap の lastmod)は data/lastmod.json から決まるので、ローカルでビルドしたときの lastmod.json をコミットしておく
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/validate.js
      - run: node tools/build.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4

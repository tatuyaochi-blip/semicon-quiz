<h1>聯絡我們</h1>
<p>若要回報題目或解析中的錯誤、提出意見與需求，或有其他關於本站的事項，請使用下方的表單。</p>
<p>回報錯誤時，請附上<strong>領域與題目開頭的文字</strong>（名詞解釋、比較、圖解集與計算工具則請附上頁面名稱），方便我們迅速找到。經確認的錯誤會陸續更正。</p>
<p><a class="btn btn-primary" href="{{contactFormUrl}}" target="_blank" rel="noopener">開啟聯絡表單</a></p>
<p class="muted">表單為英文版，可以用英文或中文填寫。</p>
<p class="muted">Google 表單會在新分頁中開啟。我們可能無法回覆每一則訊息。</p>
<p class="muted">我們無法回答與認證考試本身有關的問題。</p>
<p class="muted">您輸入的資訊將如何處理，請參閱<a href="{{home}}privacy/">隱私權政策</a>。</p>

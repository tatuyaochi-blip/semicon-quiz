<div class="term-layout">
<div class="rail-head">
<h1>{{name}}</h1>
<p class="lead">{{description}}</p>
{{lectureJump}}

  <div class="tile"><span class="tile-num" data-rate="{{id}}">—</span><span class="tile-label">{{t_your_rate}}</span></div>
  <div class="tile"><span class="tile-num"><span data-answered="{{id}}">0</span><small> / {{count}}</small></span><span class="tile-label">{{t_answered_label}}</span></div>
</div>

{{modes}}
</div>
{{rail}}
<div class="term-body">

<section class="prose" id="lecture">
  <h2>{{keyPoints}}</h2>
  {{intro}}
  {{lecture}}
</section>

{{questionList}}

{{compareLinks}}

{{books}}

<div data-ad="category"></div>

<section class="rail-dup">
  <h2>{{otherInGroup}}</h2>
  {{siblings}}
</section>
</div>
</div>

<!doctype html>
<html lang="ja" data-base="{{base}}"{{htmlAttrs}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
{{head}}
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1d64c8">
<link rel="stylesheet" href="{{base}}css/style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="logo" href="{{base}}"><span class="logo-mark" aria-hidden="true"></span>{{siteName}}</a>
    <nav class="header-nav">
      <a href="{{base}}stats/">成績</a>
      <a href="{{base}}glossary/">用語集</a>
    </nav>
  </div>
</header>

<main class="wrap">
{{content}}
</main>

<footer class="site-footer">
  <div class="wrap">
    <p class="unofficial">当サイトは個人が運営する<strong>非公式</strong>の学習サイトです。半導体技術者検定の主催団体とは一切関係ありません。</p>
    <nav class="footer-nav">
      <a href="{{base}}about/">サイトについて</a>
      <a href="{{base}}privacy/">プライバシーポリシー</a>
      <a href="{{base}}disclaimer/">免責事項</a>
      <a href="{{base}}contact/">お問い合わせ</a>
    </nav>
    <p class="copyright">© {{year}} {{siteName}}</p>
  </div>
</footer>
{{scripts}}
</body>
</html>

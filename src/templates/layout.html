<!doctype html>
<html lang="{{htmlLang}}" data-lang="{{lang}}" data-base="{{base}}" data-home="{{home}}"{{htmlAttrs}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
{{head}}
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1d64c8">
<link rel="stylesheet" href="{{base}}css/style.css">
</head>
<body>
{{langBanner}}
<header class="site-header">
  <div class="wrap header-inner">
    <a class="logo" href="{{home}}"><span class="logo-mark" aria-hidden="true"></span><span>{{siteName}}<small>{{t_logo_sub}}</small></span></a>
    <nav class="header-nav">{{headerNav}}</nav>
    <form class="site-search" role="search" action="{{home}}search/" method="get"><input type="search" name="q" placeholder="{{t_search_placeholder}}" aria-label="{{t_search_label}}" autocomplete="off"></form>
    <nav class="lang-switch" aria-label="Language">{{langLinks}}</nav>
  </div>
</header>

<main class="wrap">
{{content}}
</main>

<footer class="site-footer">
  <div class="wrap">
    <p class="unofficial">{{t_footer_unofficial}}</p>
    <p class="footer-request"><a href="{{home}}contact/">{{t_contact_notice}}</a></p>
    <nav class="footer-nav">
      <a href="{{home}}about/">{{t_footer_about}}</a>
      <a href="{{home}}figures/">{{t_footer_figures}}</a>
      <a href="{{home}}privacy/">{{t_footer_privacy}}</a>
      <a href="{{home}}disclaimer/">{{t_footer_disclaimer}}</a>
      <a href="{{home}}contact/">{{t_footer_contact}}</a>
    </nav>
    <p class="copyright">© {{year}} {{siteName}}</p>
  </div>
</footer>
{{scripts}}
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("{{base}}sw.js");</script>
</body>
</html>

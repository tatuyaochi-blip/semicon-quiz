<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 322" role="img">
<title>熱抵抗の直列回路モデル</title>
<text x="20" y="30" text-anchor="start">ヒートシンクを付けた場合</text>
<line x1="70" y1="100" x2="470" y2="100" class="ln"/>
<rect x="105" y="90" width="60" height="20" class="ok"/>
<rect x="235" y="90" width="60" height="20" class="ok"/>
<rect x="365" y="90" width="60" height="20" class="ok"/>
<circle cx="70" cy="100" r="5" class="ink"/>
<circle cx="200" cy="100" r="5" class="ink"/>
<circle cx="330" cy="100" r="5" class="ink"/>
<circle cx="470" cy="100" r="5" class="ink"/>
<text x="70" y="80" text-anchor="middle">Tj</text>
<text x="200" y="80" text-anchor="middle">Tc</text>
<text x="330" y="80" text-anchor="middle">Ts</text>
<text x="470" y="80" text-anchor="middle">Ta</text>
<text x="135" y="80" text-anchor="middle" class="a">θJC</text>
<text x="265" y="80" text-anchor="middle" class="a">θCS</text>
<text x="395" y="80" text-anchor="middle" class="a">θSA</text>
<text x="70" y="128" text-anchor="middle" class="sm">接合</text>
<text x="200" y="128" text-anchor="middle" class="sm">ケース</text>
<text x="330" y="128" text-anchor="middle" class="sm">ヒートシンク</text>
<text x="470" y="128" text-anchor="middle" class="sm">周囲</text>
<line x1="80" y1="150" x2="452" y2="150" class="ac"/><polygon points="460,150 452,154 452,146" class="fa"/>
<text x="270" y="172" text-anchor="middle" class="sm">熱の流れ P（消費電力）が電流に相当</text>
<text x="270" y="200" text-anchor="middle" class="a">Tj = Ta + P × (θJC + θCS + θSA)</text>
<line x1="20" y1="216" x2="540" y2="216" class="thin"/>
<text x="20" y="238" text-anchor="start">θJAだけで見積もる場合</text>
<line x1="70" y1="276" x2="330" y2="276" class="ln"/>
<rect x="150" y="266" width="100" height="20" class="ok"/>
<circle cx="70" cy="276" r="5" class="ink"/>
<circle cx="330" cy="276" r="5" class="ink"/>
<text x="70" y="262" text-anchor="middle">Tj</text>
<text x="330" y="262" text-anchor="middle">Ta</text>
<text x="200" y="262" text-anchor="middle" class="a">θJA</text>
<text x="360" y="281" text-anchor="start" class="a">Tj = Ta + P × θJA</text>
<text x="20" y="310" text-anchor="start" class="sm m">θJAは試験用の基板で測った値で、実装の条件で変わる</text>
</svg>

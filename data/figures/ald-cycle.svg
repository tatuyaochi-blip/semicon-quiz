<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" role="img">
<title>ALD（原子層堆積）の1サイクル</title>
<rect x="20" y="40" width="125" height="70" rx="10" class="ok"/>
<text x="82" y="70" text-anchor="middle">原料Aを供給</text>
<text x="82" y="94" text-anchor="middle" class="sm m">表面で自己停止</text>
<rect x="165" y="40" width="125" height="70" rx="10" class="ok"/>
<text x="227" y="70" text-anchor="middle">パージ</text>
<text x="227" y="94" text-anchor="middle" class="sm m">余分なAを排気</text>
<rect x="310" y="40" width="125" height="70" rx="10" class="ok"/>
<text x="372" y="70" text-anchor="middle">原料Bを供給</text>
<text x="372" y="94" text-anchor="middle" class="sm m">Aと反応して1層</text>
<rect x="455" y="40" width="125" height="70" rx="10" class="ok"/>
<text x="517" y="70" text-anchor="middle">パージ</text>
<text x="517" y="94" text-anchor="middle" class="sm m">副生成物を排気</text>
<line x1="147" y1="75" x2="159" y2="75" class="ln"/>
<polygon points="164,75 155,70 155,80" class="ink"/>
<line x1="292" y1="75" x2="304" y2="75" class="ln"/>
<polygon points="309,75 300,70 300,80" class="ink"/>
<line x1="437" y1="75" x2="449" y2="75" class="ln"/>
<polygon points="454,75 445,70 445,80" class="ink"/>
<path d="M517,110 V140 H82 V122" class="thin"/>
<polygon points="82,112 77,121 87,121" class="ink"/>
<text x="300" y="133" text-anchor="middle" class="sm m">くり返す</text>
<text x="300" y="180" text-anchor="middle" class="sm a">1サイクルで約0.1 nm。回数で膜厚を原子層単位に制御できる</text>
</svg>

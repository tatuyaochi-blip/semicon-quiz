<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img">
<title>ロジックレベルとノイズマージン</title>
<rect x="110" y="30" width="80" height="35" class="band"/>
<rect x="110" y="65" width="80" height="155" class="dep"/>
<rect x="110" y="220" width="80" height="40" class="band"/>
<text x="150" y="53" text-anchor="middle" class="sm">Hの出力</text>
<text x="150" y="245" text-anchor="middle" class="sm">Lの出力</text>
<rect x="370" y="30" width="80" height="80" class="band"/>
<rect x="370" y="110" width="80" height="70" class="ng"/>
<rect x="370" y="180" width="80" height="80" class="band"/>
<text x="410" y="75" text-anchor="middle" class="sm">Hと判定</text>
<text x="410" y="150" text-anchor="middle" class="sm">不定</text>
<text x="410" y="225" text-anchor="middle" class="sm">Lと判定</text>
<text x="102" y="35" text-anchor="end" class="sm m">VDD</text>
<text x="102" y="265" text-anchor="end" class="sm m">0 V</text>
<text x="102" y="70" text-anchor="end" class="sm">VOH(min)</text>
<text x="102" y="225" text-anchor="end" class="sm">VOL(max)</text>
<text x="458" y="115" text-anchor="start" class="sm">VIH(min)</text>
<text x="458" y="185" text-anchor="start" class="sm">VIL(max)</text>
<line x1="190" y1="65" x2="370" y2="65" class="dash"/>
<line x1="190" y1="220" x2="370" y2="220" class="dash"/>
<line x1="190" y1="110" x2="370" y2="110" class="dash"/>
<line x1="190" y1="180" x2="370" y2="180" class="dash"/>
<line x1="280" y1="65" x2="280" y2="110" class="ac"/><line x1="274" y1="65" x2="286" y2="65" class="ac"/><line x1="274" y1="110" x2="286" y2="110" class="ac"/>
<text x="292" y="93" text-anchor="start" class="a">NMH</text>
<line x1="280" y1="180" x2="280" y2="220" class="ac"/><line x1="274" y1="180" x2="286" y2="180" class="ac"/><line x1="274" y1="220" x2="286" y2="220" class="ac"/>
<text x="292" y="205" text-anchor="start" class="a">NML</text>
<text x="150" y="282" text-anchor="middle" class="sm">出力側の保証値</text>
<text x="410" y="282" text-anchor="middle" class="sm">入力側のしきい値</text>
<text x="140" y="308" text-anchor="middle" class="sm a">NMH = VOH(min) − VIH(min)</text>
<text x="420" y="308" text-anchor="middle" class="sm a">NML = VIL(max) − VOL(max)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" role="img">
<title>バスタブ曲線（故障率の時間変化）</title>
<line x1="60" y1="230" x2="493.6" y2="230" class="ln"/><polygon points="500,230 492,234 492,226" class="ink"/>
<line x1="60" y1="230" x2="60" y2="31.4" class="ln"/><polygon points="60,25 64,33 56,33" class="ink"/>
<text x="506" y="235" text-anchor="start" class="sm">時間</text>
<text x="34" y="128" text-anchor="middle" class="sm" transform="rotate(-90 34 128)">故障率</text>
<line x1="180" y1="40" x2="180" y2="230" class="dash"/>
<line x1="360" y1="40" x2="360" y2="230" class="dash"/>
<path d="M70,50 C100,160 130,185 180,190 L360,190 C410,190 440,170 480,70" class="ac"/>
<text x="140" y="110" text-anchor="middle" class="sm m">下がる</text>
<text x="270" y="175" text-anchor="middle" class="sm m">ほぼ一定</text>
<text x="395" y="130" text-anchor="middle" class="sm m">上がる</text>
<text x="120" y="215" text-anchor="middle">初期故障期</text>
<text x="270" y="215" text-anchor="middle">偶発故障期</text>
<text x="420" y="215" text-anchor="middle">摩耗故障期</text>
<text x="120" y="252" text-anchor="middle" class="sm m">バーンインで取り除く</text>
<text x="420" y="252" text-anchor="middle" class="sm m">製品寿命より後に来るよう設計</text>
</svg>

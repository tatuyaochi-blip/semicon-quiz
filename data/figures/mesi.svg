<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 326" role="img">
<title>MESIプロトコルの状態遷移</title>
<line x1="274" y1="148" x2="274" y2="76" class="ac"/><polygon points="274,68 278.5,77 269.5,77" class="fa"/>
<line x1="286" y1="68" x2="286" y2="140" class="dash"/><polygon points="286,148 281.5,139 290.5,139" class="ink"/>
<text x="266" y="114" text-anchor="end" class="sm">自分が書く</text>
<text x="294" y="114" text-anchor="start" class="sm m">他が書く</text>
<line x1="86" y1="166" x2="248" y2="166" class="dash"/><polygon points="256,166 247,170.5 247,161.5" class="ink"/>
<line x1="256" y1="178" x2="94" y2="178" class="ac"/><polygon points="86,178 95,173.5 95,182.5" class="fa"/>
<text x="171" y="158" text-anchor="middle" class="sm m">他が書く</text>
<text x="171" y="196" text-anchor="middle" class="sm">自分が読む（他にもある）</text>
<line x1="474" y1="166" x2="312" y2="166" class="dash"/><polygon points="304,166 313,161.5 313,170.5" class="ink"/>
<line x1="304" y1="178" x2="466" y2="178" class="ac"/><polygon points="474,178 465,182.5 465,173.5" class="fa"/>
<text x="389" y="158" text-anchor="middle" class="sm m">他が書く</text>
<text x="389" y="196" text-anchor="middle" class="sm">自分が読む（他にない）</text>
<line x1="79.7" y1="154.7" x2="249.4" y2="55" class="ac"/><polygon points="256.3,51 250.8,59.4 246.2,51.7" class="fa"/>
<line x1="262.3" y1="61.3" x2="92.6" y2="161" class="dash"/><polygon points="85.7,165 91.2,156.6 95.8,164.3" class="ink"/>
<text x="14" y="66" text-anchor="start" class="sm">自分が書く（他を無効化）</text>
<text x="14" y="86" text-anchor="start" class="sm m">他が読む（書き戻す）</text>
<line x1="477.3" y1="159.8" x2="307.6" y2="60.2" class="ac"/><polygon points="300.7,56.2 310.7,56.8 306.2,64.6" class="fa"/>
<text x="394" y="100" text-anchor="start" class="sm">自分が書く（通知なし）</text>
<path d="M 498 196 Q 498 262 280 262 Q 62 262 62 205" class="dash"/>
<polygon points="62,196 66.5,205 57.5,205" class="ink"/>
<text x="280" y="254" text-anchor="middle" class="sm m">他が読む</text>
<circle cx="280" cy="44" r="24" class="ng"/>
<text x="280" y="50" text-anchor="middle" class="a">M</text>
<circle cx="280" cy="172" r="24" class="ok"/>
<text x="280" y="178" text-anchor="middle" class="a">I</text>
<circle cx="62" cy="172" r="24" class="n"/>
<text x="62" y="178" text-anchor="middle" class="a">S</text>
<circle cx="498" cy="172" r="24" class="ox"/>
<text x="498" y="178" text-anchor="middle" class="a">E</text>
<line x1="20" y1="285" x2="50" y2="285" class="ac"/>
<text x="56" y="290" text-anchor="start" class="sm">自分のコアの読み書き</text>
<line x1="300" y1="285" x2="330" y2="285" class="dash"/>
<text x="336" y="290" text-anchor="start" class="sm">他のコアの読み書きを検知</text>
<text x="14" y="316" text-anchor="start" class="sm m">M：変更済み・自分だけ</text>
<text x="182" y="316" text-anchor="start" class="sm m">E：未変更・自分だけ</text>
<text x="344" y="316" text-anchor="start" class="sm m">S：未変更・共有</text>
<text x="474" y="316" text-anchor="start" class="sm m">I：無効</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" role="img">
<title>セットアップ時間とホールド時間</title>
<rect x="200" y="38" width="130" height="114" class="band"/>
<text x="280" y="28" text-anchor="middle" class="sm a">クロックのエッジ</text>
<text x="20" y="66" text-anchor="start" class="sm">クロック</text>
<path d="M100,48 H160 V78 H280 V48 H420 V78 H540" class="ln"/>
<polygon points="280,56 275,66 285,66" class="ink"/>
<text x="20" y="136" text-anchor="start" class="sm">データ</text>
<path d="M100,116 H160 L175,146 H365 L380,116 H540" class="ln"/>
<path d="M100,146 H160 L175,116 H365 L380,146 H540" class="ln"/>
<text x="130" y="107" text-anchor="middle" class="sm m">前のデータ</text>
<text x="460" y="107" text-anchor="middle" class="sm m">次のデータ</text>
<line x1="280" y1="38" x2="280" y2="175" class="dash"/>
<line x1="200" y1="172" x2="280" y2="172" class="thin"/><line x1="200" y1="167" x2="200" y2="177" class="thin"/><line x1="280" y1="167" x2="280" y2="177" class="thin"/>
<line x1="280" y1="172" x2="330" y2="172" class="thin"/><line x1="280" y1="167" x2="280" y2="177" class="thin"/><line x1="330" y1="167" x2="330" y2="177" class="thin"/>
<text x="272" y="194" text-anchor="end" class="sm a">セットアップ時間 tsu</text>
<text x="288" y="194" text-anchor="start" class="sm a">ホールド時間 th</text>
<text x="280" y="222" text-anchor="middle" class="sm">この間はデータを変えてはいけない</text>
<text x="280" y="246" text-anchor="middle" class="sm m">セットアップ違反：データの到着が遅すぎる</text>
<text x="280" y="264" text-anchor="middle" class="sm m">ホールド違反：次のデータへの変化が早すぎる</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" role="img">
<title>コンピュータの記憶階層</title>
<text x="300" y="20" text-anchor="middle" class="sm a">速い・容量が小さい・ビットあたり高価</text>
<polygon points="280,30 320,30 360,74 240,74" class="band" stroke="currentColor" stroke-opacity=".3"/>
<text x="300" y="58" text-anchor="middle" class="sm">レジスタ</text>
<polygon points="240,74 360,74 400,118 200,118" class="n" stroke="currentColor" stroke-opacity=".3"/>
<text x="300" y="102" text-anchor="middle">L1キャッシュ</text>
<polygon points="200,118 400,118 440,162 160,162" class="band" stroke="currentColor" stroke-opacity=".3"/>
<text x="300" y="146" text-anchor="middle">L2・L3キャッシュ</text>
<polygon points="160,162 440,162 480,206 120,206" class="n" stroke="currentColor" stroke-opacity=".3"/>
<text x="300" y="190" text-anchor="middle">主記憶（DRAM）</text>
<polygon points="120,206 480,206 520,250 80,250" class="band" stroke="currentColor" stroke-opacity=".3"/>
<text x="300" y="234" text-anchor="middle">ストレージ（SSD・HDD）</text>
<text x="300" y="278" text-anchor="middle" class="sm m">遅い・容量が大きい・ビットあたり安価</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 322" role="img">
<title>仮想アドレスから物理アドレスへの変換（TLBとページテーブル）</title>
<text x="50" y="22" text-anchor="start" class="sm m">仮想アドレス</text>
<rect x="50" y="30" width="280" height="28" class="n"/>
<text x="190" y="49" text-anchor="middle">仮想ページ番号（VPN）</text>
<rect x="330" y="30" width="190" height="28" class="p"/>
<text x="425" y="49" text-anchor="middle">ページ内オフセット</text>
<rect x="50" y="100" width="160" height="62" rx="8" class="band"/>
<text x="130" y="125" text-anchor="middle">TLB</text>
<text x="130" y="147" text-anchor="middle" class="sm">変換結果のキャッシュ</text>
<line x1="130" y1="58" x2="130" y2="91" class="ln"/><polygon points="130,99 125.5,90 134.5,90" class="ink"/>
<rect x="264" y="100" width="140" height="62" rx="8" class="metal"/>
<text x="334" y="125" text-anchor="middle">ページテーブル</text>
<text x="334" y="147" text-anchor="middle" class="sm">主記憶にある表</text>
<line x1="210" y1="118" x2="256" y2="118" class="ln"/><polygon points="263,118 255,122 255,114" class="ink"/>
<text x="237" y="111" text-anchor="middle" class="sm a">ミス</text>
<line x1="264" y1="146" x2="218" y2="146" class="dash"/><polygon points="211,146 219,142 219,150" class="ink"/>
<text x="237" y="162" text-anchor="middle" class="sm m">登録</text>
<line x1="130" y1="162" x2="130" y2="255" class="ac"/><polygon points="130,263 125.5,254 134.5,254" class="fa"/>
<text x="140" y="216" text-anchor="start" class="sm a">ヒット</text>
<line x1="300" y1="162" x2="300" y2="255" class="ln"/><polygon points="300,263 295.5,254 304.5,254" class="ink"/>
<text x="308" y="216" text-anchor="start" class="sm">ページウォーク</text>
<line x1="470" y1="58" x2="470" y2="255" class="ac2"/><polygon points="470,263 465.5,254 474.5,254" class="fa2"/>
<text x="478" y="166" text-anchor="start" class="sm a">変換しない</text>
<rect x="50" y="264" width="280" height="28" class="n"/>
<text x="190" y="283" text-anchor="middle">物理ページ番号（PFN）</text>
<rect x="330" y="264" width="190" height="28" class="p"/>
<text x="425" y="283" text-anchor="middle">ページ内オフセット</text>
<text x="50" y="312" text-anchor="start" class="sm m">物理アドレス</text>
<text x="520" y="312" text-anchor="end" class="sm m">4 KBのページならオフセットは下位12ビット</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 225" role="img">
<title>磁気トンネル接合（MTJ）の2つの状態</title>
<rect x="60" y="50" width="160" height="40" class="n"/>
<rect x="60" y="90" width="160" height="12" class="ox"/>
<rect x="60" y="102" width="160" height="40" class="n"/>
<line x1="95" y1="70" x2="175" y2="70" class="ac"/>
<polygon points="185,70 173,64 173,76" class="fa"/>
<line x1="95" y1="122" x2="175" y2="122" class="ln"/>
<polygon points="185,122 173,116 173,128" class="ink"/>
<rect x="280" y="50" width="160" height="40" class="n"/>
<rect x="280" y="90" width="160" height="12" class="ox"/>
<rect x="280" y="102" width="160" height="40" class="n"/>
<line x1="405" y1="70" x2="325" y2="70" class="ac"/>
<polygon points="315,70 327,64 327,76" class="fa"/>
<line x1="315" y1="122" x2="395" y2="122" class="ln"/>
<polygon points="405,122 393,116 393,128" class="ink"/>
<text x="452" y="75" text-anchor="start" class="sm">自由層（書き換える）</text>
<text x="452" y="100" text-anchor="start" class="sm">トンネル障壁（MgO）</text>
<text x="452" y="127" text-anchor="start" class="sm">参照層（固定）</text>
<text x="140" y="170" text-anchor="middle">平行</text>
<text x="140" y="195" text-anchor="middle" class="sm a">抵抗が低い</text>
<text x="360" y="170" text-anchor="middle">反平行</text>
<text x="360" y="195" text-anchor="middle" class="sm">抵抗が高い</text>
</svg>

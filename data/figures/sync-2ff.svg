<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 335" role="img">
<title>2段フリップフロップの同期化回路</title>
<text x="85" y="26" text-anchor="middle" class="sm m">送り側クロックのドメイン</text>
<text x="365" y="26" text-anchor="middle" class="sm m">受け側クロックのドメイン</text>
<line x1="165" y1="36" x2="165" y2="172" class="dash"/>
<rect x="40" y="54" width="76" height="60" class="ok"/>
<text x="78" y="89" text-anchor="middle" class="sm">送り側FF</text>
<polygon points="40,92 50,98 40,104" class="thin"/>
<rect x="215" y="54" width="70" height="60" class="ok"/>
<text x="250" y="89" text-anchor="middle" class="sm">FF1</text>
<polygon points="215,92 225,98 215,104" class="thin"/>
<rect x="355" y="54" width="70" height="60" class="ok"/>
<text x="390" y="89" text-anchor="middle" class="sm">FF2</text>
<polygon points="355,92 365,98 355,104" class="thin"/>
<line x1="116" y1="72" x2="207" y2="72" class="ln"/><polygon points="215,72 207,76 207,68" class="ink"/>
<text x="190" y="64" text-anchor="middle" class="sm">非同期</text>
<line x1="285" y1="72" x2="355" y2="72" class="ac"/>
<text x="320" y="64" text-anchor="middle" class="sm a">直結</text>
<line x1="425" y1="72" x2="537" y2="72" class="ln"/><polygon points="545,72 537,76 537,68" class="ink"/>
<text x="434" y="64" text-anchor="start" class="sm">同期化された出力</text>
<path d="M24,148 L24,98 L40,98" class="ln"/>
<text x="20" y="168" text-anchor="start" class="sm">送り側クロック</text>
<path d="M200,148 L200,98 L215,98" class="ln"/>
<path d="M200,148 L340,148 L340,98 L355,98" class="ln"/>
<line x1="188" y1="148" x2="200" y2="148" class="ln"/>
<circle cx="200" cy="148" r="3.5" class="ink"/>
<text x="190" y="168" text-anchor="start" class="sm">受け側クロック</text>
<text x="250" y="132" text-anchor="middle" class="sm m">不定になりうる</text>
<rect x="150" y="228" width="140" height="32" class="band"/>
<line x1="150" y1="188" x2="150" y2="304" class="dash"/>
<line x1="290" y1="188" x2="290" y2="304" class="dash"/>
<text x="18" y="210" text-anchor="start" class="sm">受け側クロック</text>
<path d="M120,212 H150 V194 H220 V212 H290 V194 H360 V212 H430 V194 H500 V212 H540" class="ln"/>
<text x="18" y="250" text-anchor="start" class="sm">FF1の出力</text>
<path d="M120,252 H153" class="ln"/>
<path d="M153,252 L160,244 H222" class="ac"/>
<path d="M222,244 L232,236 H540" class="ln"/>
<text x="185" y="240" text-anchor="middle" class="sm a">不定</text>
<text x="18" y="290" text-anchor="start" class="sm">FF2の出力</text>
<path d="M120,294 H296 V276 H540" class="ln"/>
<text x="220" y="274" text-anchor="middle" class="sm">約1周期</text>
<text x="280" y="326" text-anchor="middle" class="sm a">1段目が不定になっても、次のエッジまでに収まればFF2は正しい値になる</text>
</svg>

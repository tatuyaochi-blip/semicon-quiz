<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" role="img">
<title>割り込み処理の流れ</title>
<rect x="160" y="24" width="236" height="30" rx="6" class="p"/>
<text x="172" y="44" text-anchor="start" class="sm">① 装置が割り込みを要求（IRQ）</text>
<text x="406" y="44" text-anchor="start" class="sm m">タイマ、受信完了など</text>
<line x1="278" y1="54" x2="278" y2="57" class="ln"/><polygon points="278,63 274.5,56 281.5,56" class="ink"/>
<rect x="160" y="64" width="236" height="30" rx="6" class="n"/>
<text x="172" y="84" text-anchor="start" class="sm">② 実行中の命令を終える</text>
<text x="406" y="84" text-anchor="start" class="sm m">命令の途中では止めない</text>
<line x1="278" y1="94" x2="278" y2="97" class="ln"/><polygon points="278,103 274.5,96 281.5,96" class="ink"/>
<rect x="160" y="104" width="236" height="30" rx="6" class="n"/>
<text x="172" y="124" text-anchor="start" class="sm">③ PCと状態を保存する</text>
<text x="406" y="124" text-anchor="start" class="sm m">戻り先と動作モード</text>
<line x1="278" y1="134" x2="278" y2="137" class="ln"/><polygon points="278,143 274.5,136 281.5,136" class="ink"/>
<rect x="160" y="144" width="236" height="30" rx="6" class="n"/>
<text x="172" y="164" text-anchor="start" class="sm">④ ベクタテーブルを引く</text>
<text x="406" y="164" text-anchor="start" class="sm m">番号からハンドラの番地</text>
<line x1="278" y1="174" x2="278" y2="177" class="ln"/><polygon points="278,183 274.5,176 281.5,176" class="ink"/>
<rect x="160" y="184" width="236" height="30" rx="6" class="ox"/>
<text x="172" y="204" text-anchor="start" class="sm">⑤ ハンドラ（ISR）を実行</text>
<text x="406" y="204" text-anchor="start" class="sm m">使うレジスタも退避</text>
<line x1="278" y1="214" x2="278" y2="217" class="ln"/><polygon points="278,223 274.5,216 281.5,216" class="ink"/>
<rect x="160" y="224" width="236" height="30" rx="6" class="ox"/>
<text x="172" y="244" text-anchor="start" class="sm">⑥ 割り込みの要因をクリア</text>
<text x="406" y="244" text-anchor="start" class="sm m">忘れると再び割り込む</text>
<line x1="278" y1="254" x2="278" y2="257" class="ln"/><polygon points="278,263 274.5,256 281.5,256" class="ink"/>
<rect x="160" y="264" width="236" height="30" rx="6" class="n"/>
<text x="172" y="284" text-anchor="start" class="sm">⑦ 状態を戻して元の処理へ</text>
<text x="406" y="284" text-anchor="start" class="sm m">復帰命令（mretなど）</text>
<polyline points="150,26 144,26 144,52 150,52" class="thin"/>
<text x="136" y="44" text-anchor="end" class="sm a">装置</text>
<polyline points="150,66 144,66 144,172 150,172" class="thin"/>
<text x="136" y="124" text-anchor="end" class="sm a">CPU（自動）</text>
<polyline points="150,186 144,186 144,252 150,252" class="thin"/>
<text x="136" y="224" text-anchor="end" class="sm a">ソフトウェア</text>
<polyline points="150,266 144,266 144,292 150,292" class="thin"/>
<text x="136" y="284" text-anchor="end" class="sm a">CPU</text>
<text x="280" y="320" text-anchor="middle" class="sm">中断した命令の次から実行を再開する</text>
</svg>

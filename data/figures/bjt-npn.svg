<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" role="img">
<title>NPNトランジスタの能動領域での動作</title>
<rect x="60" y="60" width="150" height="80" class="n"/>
<text x="135" y="98" text-anchor="middle">エミッタ</text>
<text x="135" y="120" text-anchor="middle" class="sm m">n⁺</text>
<rect x="210" y="60" width="60" height="80" class="p"/>
<text x="240" y="98" text-anchor="middle" class="sm">ベース</text>
<text x="240" y="120" text-anchor="middle" class="sm m">p</text>
<rect x="270" y="60" width="230" height="80" class="n"/>
<text x="385" y="98" text-anchor="middle">コレクタ</text>
<text x="385" y="120" text-anchor="middle" class="sm m">n</text>
<text x="205" y="42" text-anchor="end" class="sm a">B-E接合：順バイアス</text>
<text x="275" y="42" text-anchor="start" class="sm">B-C接合：逆バイアス</text>
<line x1="90" y1="168" x2="470" y2="168" class="ac"/>
<polygon points="482,168 470,162 470,174" class="fa"/>
<text x="280" y="196" text-anchor="middle" class="sm a">エミッタから注入された電子の多くが、ベースを通り抜けてコレクタへ</text>
<text x="280" y="218" text-anchor="middle" class="sm m">ベースが薄いほど再結合が少なく、電流増幅率が大きくなる</text>
</svg>

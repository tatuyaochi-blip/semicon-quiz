<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 328" role="img">
<title>5段パイプラインとロード使用ハザードによるバブル</title>
<text x="544" y="18" text-anchor="end" class="sm m">時間（クロック）</text>
<line x1="140" y1="26" x2="544" y2="26" class="thin"/><polygon points="552,26 543,30.5 543,21.5" class="ink"/>
<text x="162" y="46" text-anchor="middle" class="sm m">1</text>
<text x="208" y="46" text-anchor="middle" class="sm m">2</text>
<text x="254" y="46" text-anchor="middle" class="sm m">3</text>
<text x="300" y="46" text-anchor="middle" class="sm m">4</text>
<text x="346" y="46" text-anchor="middle" class="sm m">5</text>
<text x="392" y="46" text-anchor="middle" class="sm m">6</text>
<text x="438" y="46" text-anchor="middle" class="sm m">7</text>
<text x="484" y="46" text-anchor="middle" class="sm m">8</text>
<text x="530" y="46" text-anchor="middle" class="sm m">9</text>
<text x="14" y="46" text-anchor="start" class="sm m">命令</text>
<text x="14" y="74" text-anchor="start" class="sm">lw x1, 0(x2)</text>
<rect x="140" y="56" width="44" height="26" rx="4" class="n"/>
<text x="162" y="74" text-anchor="middle" class="sm">IF</text>
<rect x="186" y="56" width="44" height="26" rx="4" class="band"/>
<text x="208" y="74" text-anchor="middle" class="sm">ID</text>
<rect x="232" y="56" width="44" height="26" rx="4" class="ox"/>
<text x="254" y="74" text-anchor="middle" class="sm">EX</text>
<rect x="278" y="56" width="44" height="26" rx="4" class="p"/>
<text x="300" y="74" text-anchor="middle" class="sm">MEM</text>
<rect x="324" y="56" width="44" height="26" rx="4" class="metal"/>
<text x="346" y="74" text-anchor="middle" class="sm">WB</text>
<text x="14" y="108" text-anchor="start" class="sm">add x3, x1, x4</text>
<rect x="186" y="90" width="44" height="26" rx="4" class="n"/>
<text x="208" y="108" text-anchor="middle" class="sm">IF</text>
<rect x="232" y="90" width="44" height="26" rx="4" class="band"/>
<text x="254" y="108" text-anchor="middle" class="sm">ID</text>
<rect x="278" y="90" width="44" height="26" rx="4" class="dep"/>
<text x="300" y="108" text-anchor="middle" class="sm">バブル</text>
<rect x="324" y="90" width="44" height="26" rx="4" class="ox"/>
<text x="346" y="108" text-anchor="middle" class="sm">EX</text>
<rect x="370" y="90" width="44" height="26" rx="4" class="p"/>
<text x="392" y="108" text-anchor="middle" class="sm">MEM</text>
<rect x="416" y="90" width="44" height="26" rx="4" class="metal"/>
<text x="438" y="108" text-anchor="middle" class="sm">WB</text>
<text x="14" y="142" text-anchor="start" class="sm">sub x5, x6, x7</text>
<rect x="278" y="124" width="44" height="26" rx="4" class="n"/>
<text x="300" y="142" text-anchor="middle" class="sm">IF</text>
<rect x="324" y="124" width="44" height="26" rx="4" class="band"/>
<text x="346" y="142" text-anchor="middle" class="sm">ID</text>
<rect x="370" y="124" width="44" height="26" rx="4" class="ox"/>
<text x="392" y="142" text-anchor="middle" class="sm">EX</text>
<rect x="416" y="124" width="44" height="26" rx="4" class="p"/>
<text x="438" y="142" text-anchor="middle" class="sm">MEM</text>
<rect x="462" y="124" width="44" height="26" rx="4" class="metal"/>
<text x="484" y="142" text-anchor="middle" class="sm">WB</text>
<text x="14" y="176" text-anchor="start" class="sm">or x8, x9, x10</text>
<rect x="324" y="158" width="44" height="26" rx="4" class="n"/>
<text x="346" y="176" text-anchor="middle" class="sm">IF</text>
<rect x="370" y="158" width="44" height="26" rx="4" class="band"/>
<text x="392" y="176" text-anchor="middle" class="sm">ID</text>
<rect x="416" y="158" width="44" height="26" rx="4" class="ox"/>
<text x="438" y="176" text-anchor="middle" class="sm">EX</text>
<rect x="462" y="158" width="44" height="26" rx="4" class="p"/>
<text x="484" y="176" text-anchor="middle" class="sm">MEM</text>
<rect x="508" y="158" width="44" height="26" rx="4" class="metal"/>
<text x="530" y="176" text-anchor="middle" class="sm">WB</text>
<line x1="300" y1="82" x2="340.1" y2="89.8" class="ac"/><polygon points="346,91 338.5,93.1 339.8,86.2" class="fa"/>
<text x="14" y="214" text-anchor="start" class="sm a">lw が読んだ x1 を直後の add が使う（ロード使用ハザード）</text>
<text x="14" y="236" text-anchor="start" class="sm">フォワーディング（矢印）を使っても1クロックのバブルが残る</text>
<text x="14" y="258" text-anchor="start" class="sm">止まらなければ、毎クロック1命令ずつ完了する</text>
<line x1="14" y1="274" x2="546" y2="274" class="thin"/>
<text x="14" y="296" text-anchor="start" class="sm m">IF 命令の取り出し・ID 解読とレジスタ読み出し</text>
<text x="14" y="316" text-anchor="start" class="sm m">EX 実行・MEM メモリアクセス・WB 書き戻し</text>
</svg>

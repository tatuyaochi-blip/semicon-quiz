<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 245" role="img">
<title>オペアンプの反転増幅回路</title>
<polygon points="260,70 260,170 360,120" class="ok"/>
<text x="272" y="101" text-anchor="start" class="m">−</text>
<text x="272" y="151" text-anchor="start" class="m">+</text>
<text x="22" y="100" text-anchor="start">Vin</text>
<line x1="55" y1="95" x2="100" y2="95" class="ln"/>
<rect x="100" y="85" width="60" height="20" class="ok"/>
<text x="130" y="78" text-anchor="middle" class="sm">Ri</text>
<line x1="160" y1="95" x2="260" y2="95" class="ln"/>
<circle cx="210" cy="95" r="4" class="ink"/>
<line x1="210" y1="95" x2="210" y2="40" class="ln"/>
<line x1="210" y1="40" x2="260" y2="40" class="ln"/>
<rect x="260" y="30" width="60" height="20" class="ok"/>
<text x="290" y="23" text-anchor="middle" class="sm">Rf</text>
<line x1="320" y1="40" x2="400" y2="40" class="ln"/>
<line x1="400" y1="40" x2="400" y2="120" class="ln"/>
<line x1="360" y1="120" x2="450" y2="120" class="ln"/>
<circle cx="400" cy="120" r="4" class="ink"/>
<text x="458" y="125" text-anchor="start">Vout</text>
<line x1="260" y1="145" x2="230" y2="145" class="ln"/>
<line x1="230" y1="145" x2="230" y2="190" class="ln"/>
<line x1="215" y1="190" x2="245" y2="190" class="ln"/><line x1="221" y1="197" x2="239" y2="197" class="ln"/><line x1="227" y1="204" x2="233" y2="204" class="ln"/>
<text x="300" y="205" text-anchor="start" class="a">Vout = −(Rf / Ri) × Vin</text>
<text x="300" y="228" text-anchor="start" class="sm m">仮想短絡で − 入力はほぼ0 Vになる</text>
</svg>

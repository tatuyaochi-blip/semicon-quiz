<polyline points="60,41 30,41 30,272 345,272" class="ac2"/>
<text x="124" y="241" text-anchor="start" class="sm">タグを比較</text>
<text x="400" y="232" text-anchor="start" class="sm a">どれかが一致 → ヒット</text>

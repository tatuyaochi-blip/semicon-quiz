<text x="188" y="292" text-anchor="middle" class="sm">アドレスのタグを各ウェイのタグと同時に比べる</text>
<text x="280" y="318" text-anchor="middle" class="sm m">図は2ウェイの例（nウェイならn個のタグを比べる）</text>

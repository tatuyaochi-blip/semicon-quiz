<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" role="img">
<title>NAND型フラッシュのセルの並び（ストリング）</title>
<line x1="40" y1="110" x2="545" y2="110" class="ln"/>
<rect x="90" y="88" width="50" height="44" rx="6" class="metal"/>
<text x="115" y="116" text-anchor="middle" class="sm">選択</text>
<rect x="165" y="88" width="55" height="44" rx="6" class="n"/>
<text x="192" y="116" text-anchor="middle" class="sm">WL0</text>
<rect x="235" y="88" width="55" height="44" rx="6" class="n"/>
<text x="262" y="116" text-anchor="middle" class="sm">WL1</text>
<rect x="305" y="88" width="55" height="44" rx="6" class="n"/>
<text x="332" y="116" text-anchor="middle" class="sm">WL2</text>
<rect x="375" y="88" width="55" height="44" rx="6" class="n"/>
<text x="402" y="116" text-anchor="middle" class="sm">WL3</text>
<rect x="450" y="88" width="50" height="44" rx="6" class="metal"/>
<text x="475" y="116" text-anchor="middle" class="sm">選択</text>
<text x="40" y="80" text-anchor="start" class="sm">ビット線へ</text>
<text x="550" y="80" text-anchor="end" class="sm">ソース線へ</text>
<line x1="165" y1="148" x2="430" y2="148" class="thin"/>
<line x1="165" y1="142" x2="165" y2="154" class="thin"/>
<line x1="430" y1="142" x2="430" y2="154" class="thin"/>
<text x="297" y="172" text-anchor="middle" class="sm a">メモリセルを直列につなぐ</text>
<text x="300" y="205" text-anchor="middle" class="sm">NAND型：コンタクトが少なく高集積。読み出しはページ単位</text>
<text x="300" y="228" text-anchor="middle" class="sm m">NOR型：セルを並列につなぎ、1個ずつ直接読めるが面積が大きい</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" role="img"><style>:root{--bg:#f5f8fb;--surface:#ffffff;--text:#17212e;--muted:#5a6a7e;--border:#dbe3ec;--accent:#1d64c8;--accent-2:#0b8f72;--accent-soft:#e8f1fd;--ok:#0a8a5f;--ok-bg:#e5f6ef;--ng:#c93a3a;--ng-bg:#fcebeb;--grad:linear-gradient(135deg, #1d64c8, #0b8f72);--shadow:0 1px 2px rgba(20, 40, 70, .06), 0 4px 14px rgba(20, 40, 70, .05);--radius:14px;--fig-n:#d6e6fb;--fig-p:#fde6d4;--fig-ox:#fff1b8;--fig-metal:#c7d0db;--fig-dep:#f1f4f8;--fig-band:#e3ecf7;--fig-ng:#f6c9c9}@media (prefers-color-scheme: dark){:root{--bg:#0d1520;--surface:#152131;--text:#e4ebf3;--muted:#93a3b7;--border:#273649;--accent:#6aa9ff;--accent-2:#3cc9a3;--accent-soft:#1a2c44;--ok:#46d19c;--ok-bg:#12332a;--ng:#ff7b7b;--ng-bg:#3a1e24;--shadow:none;--fig-n:#1d3557;--fig-p:#4a2f22;--fig-ox:#4d4420;--fig-metal:#3a4656;--fig-dep:#1b2533;--fig-band:#1f2d40;--fig-ng:#5a2a2e}}text{font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}text { fill: var(--text); font-size: 15px;  }text.sm { font-size: 13px; }text.m { fill: var(--muted); }text.a { fill: var(--accent); font-weight: 700; }.ln { stroke: var(--text); stroke-width: 2; fill: none; }.thin { stroke: var(--muted); stroke-width: 1.2; fill: none; }.dash { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }.ac { stroke: var(--accent); stroke-width: 3; fill: none; }.ac2 { stroke: var(--accent-2); stroke-width: 3; fill: none; }.ink { fill: var(--text); }.fa { fill: var(--accent); }.fa2 { fill: var(--accent-2); }.hole { fill: var(--surface); stroke: var(--text); stroke-width: 1.5; }.n { fill: var(--fig-n); stroke: var(--muted); }.p { fill: var(--fig-p); stroke: var(--muted); }.ox { fill: var(--fig-ox); stroke: var(--muted); }.metal { fill: var(--fig-metal); stroke: var(--muted); }.dep { fill: var(--fig-dep); stroke: var(--muted); stroke-dasharray: 4 3; }.band { fill: var(--fig-band); }.ng { fill: var(--fig-ng); stroke: var(--muted); }.ok { fill: var(--surface); stroke: var(--muted); }</style><rect width="560" height="330" style="fill:var(--surface)"/>
<title>인터럽트 처리의 흐름</title>
<rect x="160" y="24" width="236" height="30" rx="6" class="p"/>
<text x="172" y="44" text-anchor="start" class="sm">① 장치가 인터럽트 요청(IRQ)</text>
<text x="406" y="44" text-anchor="start" class="sm m">타이머, 수신 완료 등</text>
<line x1="278" y1="54" x2="278" y2="57" class="ln"/><polygon points="278,63 274.5,56 281.5,56" class="ink"/>
<rect x="160" y="64" width="236" height="30" rx="6" class="n"/>
<text x="172" y="84" text-anchor="start" class="sm">② 실행 중인 명령어 완료</text>
<text x="406" y="84" text-anchor="start" class="sm m">명령어 도중엔 안 멈춤</text>
<line x1="278" y1="94" x2="278" y2="97" class="ln"/><polygon points="278,103 274.5,96 281.5,96" class="ink"/>
<rect x="160" y="104" width="236" height="30" rx="6" class="n"/>
<text x="172" y="124" text-anchor="start" class="sm">③ PC와 상태 저장</text>
<text x="406" y="124" text-anchor="start" class="sm m">복귀 주소와 동작 모드</text>
<line x1="278" y1="134" x2="278" y2="137" class="ln"/><polygon points="278,143 274.5,136 281.5,136" class="ink"/>
<rect x="160" y="144" width="236" height="30" rx="6" class="n"/>
<text x="172" y="164" text-anchor="start" class="sm">④ 벡터 테이블 참조</text>
<text x="406" y="164" text-anchor="start" class="sm m">번호로 핸들러 주소를 얻음</text>
<line x1="278" y1="174" x2="278" y2="177" class="ln"/><polygon points="278,183 274.5,176 281.5,176" class="ink"/>
<rect x="160" y="184" width="236" height="30" rx="6" class="ox"/>
<text x="172" y="204" text-anchor="start" class="sm">⑤ 핸들러(ISR) 실행</text>
<text x="406" y="204" text-anchor="start" class="sm m">사용할 레지스터도 대피</text>
<line x1="278" y1="214" x2="278" y2="217" class="ln"/><polygon points="278,223 274.5,216 281.5,216" class="ink"/>
<rect x="160" y="224" width="236" height="30" rx="6" class="ox"/>
<text x="172" y="244" text-anchor="start" class="sm">⑥ 인터럽트 요인 클리어</text>
<text x="406" y="244" text-anchor="start" class="sm m">잊으면 다시 인터럽트 발생</text>
<line x1="278" y1="254" x2="278" y2="257" class="ln"/><polygon points="278,263 274.5,256 281.5,256" class="ink"/>
<rect x="160" y="264" width="236" height="30" rx="6" class="n"/>
<text x="172" y="284" text-anchor="start" class="sm">⑦ 상태 복원 후 원래 처리로</text>
<text x="406" y="284" text-anchor="start" class="sm m">복귀 명령어(mret 등)</text>
<polyline points="150,26 144,26 144,52 150,52" class="thin"/>
<text x="136" y="44" text-anchor="end" class="sm a">장치</text>
<polyline points="150,66 144,66 144,172 150,172" class="thin"/>
<text x="136" y="124" text-anchor="end" class="sm a">CPU(자동)</text>
<polyline points="150,186 144,186 144,252 150,252" class="thin"/>
<text x="136" y="224" text-anchor="end" class="sm a">소프트웨어</text>
<polyline points="150,266 144,266 144,292 150,292" class="thin"/>
<text x="136" y="284" text-anchor="end" class="sm a">CPU</text>
<text x="280" y="320" text-anchor="middle" class="sm">중단된 명령어 다음부터 실행을 재개</text>
</svg>
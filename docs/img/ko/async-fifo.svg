<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 335" role="img"><style>:root{--bg:#f5f8fb;--surface:#ffffff;--text:#17212e;--muted:#5a6a7e;--border:#dbe3ec;--accent:#1d64c8;--accent-2:#0b8f72;--accent-soft:#e8f1fd;--ok:#0a8a5f;--ok-bg:#e5f6ef;--ng:#c93a3a;--ng-bg:#fcebeb;--grad:linear-gradient(135deg, #1d64c8, #0b8f72);--shadow:0 1px 2px rgba(20, 40, 70, .06), 0 4px 14px rgba(20, 40, 70, .05);--radius:14px;--fig-n:#d6e6fb;--fig-p:#fde6d4;--fig-ox:#fff1b8;--fig-metal:#c7d0db;--fig-dep:#f1f4f8;--fig-band:#e3ecf7;--fig-ng:#f6c9c9}@media (prefers-color-scheme: dark){:root{--bg:#0d1520;--surface:#152131;--text:#e4ebf3;--muted:#93a3b7;--border:#273649;--accent:#6aa9ff;--accent-2:#3cc9a3;--accent-soft:#1a2c44;--ok:#46d19c;--ok-bg:#12332a;--ng:#ff7b7b;--ng-bg:#3a1e24;--shadow:none;--fig-n:#1d3557;--fig-p:#4a2f22;--fig-ox:#4d4420;--fig-metal:#3a4656;--fig-dep:#1b2533;--fig-band:#1f2d40;--fig-ng:#5a2a2e}}text{font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}text { fill: var(--text); font-size: 15px;  }text.sm { font-size: 13px; }text.m { fill: var(--muted); }text.a { fill: var(--accent); font-weight: 700; }.ln { stroke: var(--text); stroke-width: 2; fill: none; }.thin { stroke: var(--muted); stroke-width: 1.2; fill: none; }.dash { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }.ac { stroke: var(--accent); stroke-width: 3; fill: none; }.ac2 { stroke: var(--accent-2); stroke-width: 3; fill: none; }.ink { fill: var(--text); }.fa { fill: var(--accent); }.fa2 { fill: var(--accent-2); }.hole { fill: var(--surface); stroke: var(--text); stroke-width: 1.5; }.n { fill: var(--fig-n); stroke: var(--muted); }.p { fill: var(--fig-p); stroke: var(--muted); }.ox { fill: var(--fig-ox); stroke: var(--muted); }.metal { fill: var(--fig-metal); stroke: var(--muted); }.dep { fill: var(--fig-dep); stroke: var(--muted); stroke-dasharray: 4 3; }.band { fill: var(--fig-band); }.ng { fill: var(--fig-ng); stroke: var(--muted); }.ok { fill: var(--surface); stroke: var(--muted); }</style><rect width="560" height="335" style="fill:var(--surface)"/>
<title>비동기 FIFO의 구성</title>
<text x="100" y="24" text-anchor="middle" class="sm m">쓰기 측(wclk)</text>
<text x="460" y="24" text-anchor="middle" class="sm m">읽기 측(rclk)</text>
<rect x="200" y="40" width="160" height="90" class="band"/>
<text x="280" y="82" text-anchor="middle" class="sm">듀얼 포트 RAM</text>
<text x="280" y="104" text-anchor="middle" class="sm m">두 클록으로 읽기/쓰기</text>
<line x1="280" y1="134" x2="280" y2="300" class="dash"/>
<line x1="40" y1="58" x2="192" y2="58" class="ln"/><polygon points="200,58 192,62 192,54" class="ink"/>
<text x="110" y="50" text-anchor="middle" class="sm">쓰기 데이터</text>
<rect x="40" y="76" width="120" height="36" class="ok"/>
<text x="100" y="99" text-anchor="middle" class="sm">쓰기 포인터</text>
<line x1="160" y1="94" x2="192" y2="94" class="ln"/><polygon points="200,94 192,98 192,90" class="ink"/>
<line x1="100" y1="112" x2="100" y2="140" class="ln"/><polygon points="100,148 96,140 104,140" class="ink"/>
<rect x="40" y="148" width="120" height="32" class="ok"/>
<text x="100" y="169" text-anchor="middle" class="sm">그레이 코드화</text>
<line x1="360" y1="58" x2="512" y2="58" class="ln"/><polygon points="520,58 512,62 512,54" class="ink"/>
<text x="450" y="50" text-anchor="middle" class="sm">읽기 데이터</text>
<rect x="400" y="76" width="120" height="36" class="ok"/>
<text x="460" y="99" text-anchor="middle" class="sm">읽기 포인터</text>
<line x1="400" y1="94" x2="368" y2="94" class="ln"/><polygon points="360,94 368,90 368,98" class="ink"/>
<line x1="460" y1="112" x2="460" y2="140" class="ln"/><polygon points="460,148 456,140 464,140" class="ink"/>
<rect x="400" y="148" width="120" height="32" class="ok"/>
<text x="460" y="169" text-anchor="middle" class="sm">그레이 코드화</text>
<path d="M100,180 L100,226 L292,226" class="ac"/><polygon points="300,226 292,230 292,222" class="fa"/>
<circle cx="100" cy="226" r="4" class="fa"/>
<rect x="300" y="212" width="80" height="28" class="ox"/>
<text x="340" y="231" text-anchor="middle" class="sm">2단 동기화</text>
<line x1="380" y1="226" x2="392" y2="226" class="ln"/><polygon points="400,226 392,230 392,222" class="ink"/>
<rect x="400" y="212" width="120" height="28" class="ok"/>
<text x="460" y="231" text-anchor="middle" class="sm">empty 판정</text>
<line x1="460" y1="180" x2="460" y2="204" class="ln"/><polygon points="460,212 456,204 464,204" class="ink"/>
<path d="M520,164 L542,164 L542,276 L268,276" class="ac2"/><polygon points="260,276 268,272 268,280" class="fa2"/>
<rect x="180" y="262" width="80" height="28" class="ox"/>
<text x="220" y="281" text-anchor="middle" class="sm">2단 동기화</text>
<line x1="180" y1="276" x2="168" y2="276" class="ln"/><polygon points="160,276 168,272 168,280" class="ink"/>
<rect x="40" y="262" width="120" height="28" class="ok"/>
<text x="100" y="281" text-anchor="middle" class="sm">full 판정</text>
<line x1="100" y1="226" x2="100" y2="254" class="ac"/><polygon points="100,262 96,254 104,254" class="fa"/>
<text x="190" y="218" text-anchor="middle" class="sm m">그레이 코드 포인터</text>
<text x="280" y="322" text-anchor="middle" class="sm a">그레이 코드는 1 증가할 때 1비트만 바뀜</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" role="img"><style>:root{--bg:#f5f8fb;--surface:#ffffff;--text:#17212e;--muted:#5a6a7e;--border:#dbe3ec;--accent:#1d64c8;--accent-2:#0b8f72;--accent-soft:#e8f1fd;--ok:#0a8a5f;--ok-bg:#e5f6ef;--ng:#c93a3a;--ng-bg:#fcebeb;--grad:linear-gradient(135deg, #1d64c8, #0b8f72);--shadow:0 1px 2px rgba(20, 40, 70, .06), 0 4px 14px rgba(20, 40, 70, .05);--radius:14px;--fig-n:#d6e6fb;--fig-p:#fde6d4;--fig-ox:#fff1b8;--fig-metal:#c7d0db;--fig-dep:#f1f4f8;--fig-band:#e3ecf7;--fig-ng:#f6c9c9}@media (prefers-color-scheme: dark){:root{--bg:#0d1520;--surface:#152131;--text:#e4ebf3;--muted:#93a3b7;--border:#273649;--accent:#6aa9ff;--accent-2:#3cc9a3;--accent-soft:#1a2c44;--ok:#46d19c;--ok-bg:#12332a;--ng:#ff7b7b;--ng-bg:#3a1e24;--shadow:none;--fig-n:#1d3557;--fig-p:#4a2f22;--fig-ox:#4d4420;--fig-metal:#3a4656;--fig-dep:#1b2533;--fig-band:#1f2d40;--fig-ng:#5a2a2e}}text{font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}text { fill: var(--text); font-size: 15px;  }text.sm { font-size: 13px; }text.m { fill: var(--muted); }text.a { fill: var(--accent); font-weight: 700; }.ln { stroke: var(--text); stroke-width: 2; fill: none; }.thin { stroke: var(--muted); stroke-width: 1.2; fill: none; }.dash { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }.ac { stroke: var(--accent); stroke-width: 3; fill: none; }.ac2 { stroke: var(--accent-2); stroke-width: 3; fill: none; }.ink { fill: var(--text); }.fa { fill: var(--accent); }.fa2 { fill: var(--accent-2); }.hole { fill: var(--surface); stroke: var(--text); stroke-width: 1.5; }.n { fill: var(--fig-n); stroke: var(--muted); }.p { fill: var(--fig-p); stroke: var(--muted); }.ox { fill: var(--fig-ox); stroke: var(--muted); }.metal { fill: var(--fig-metal); stroke: var(--muted); }.dep { fill: var(--fig-dep); stroke: var(--muted); stroke-dasharray: 4 3; }.band { fill: var(--fig-band); }.ng { fill: var(--fig-ng); stroke: var(--muted); }.ok { fill: var(--surface); stroke: var(--muted); }</style><rect width="560" height="290" style="fill:var(--surface)"/>
<title>IEEE 754 single-precision bit layout</title>
<text x="42" y="26" text-anchor="start" class="sm m">31</text>
<text x="83" y="26" text-anchor="start" class="sm m">30</text>
<text x="237" y="26" text-anchor="end" class="sm m">23</text>
<text x="243" y="26" text-anchor="start" class="sm m">22</text>
<text x="517" y="26" text-anchor="end" class="sm m">0</text>
<rect x="40" y="32" width="40" height="30" class="p"/>
<rect x="80" y="32" width="160" height="30" class="n"/>
<rect x="240" y="32" width="280" height="30" class="ox"/>
<text x="60" y="52" text-anchor="middle" class="a">s</text>
<text x="160" y="52" text-anchor="middle" class="a">e</text>
<text x="380" y="52" text-anchor="middle" class="a">f</text>
<text x="60" y="82" text-anchor="middle" class="sm">Sign</text>
<text x="160" y="82" text-anchor="middle" class="sm">Exponent (8 bits)</text>
<text x="380" y="82" text-anchor="middle" class="sm">Fraction (23 bits)</text>
<text x="60" y="100" text-anchor="middle" class="sm m">1 bit</text>
<text x="160" y="100" text-anchor="middle" class="sm m">Add bias 127</text>
<text x="380" y="100" text-anchor="middle" class="sm m">Leading 1 omitted (hidden bit)</text>
<text x="280" y="136" text-anchor="middle" class="a">Value = (−1)^s × 1.f × 2^(e − 127)</text>
<line x1="20" y1="156" x2="540" y2="156" class="thin"/>
<text x="40" y="182" text-anchor="start">e.g. −6.5 = −110.1₂ = −1.101₂ × 2²</text>
<rect x="40" y="194" width="40" height="30" class="p"/>
<rect x="80" y="194" width="160" height="30" class="n"/>
<rect x="240" y="194" width="280" height="30" class="ox"/>
<text x="60" y="214" text-anchor="middle" class="sm">1</text>
<text x="160" y="214" text-anchor="middle" class="sm">10000001</text>
<text x="380" y="214" text-anchor="middle" class="sm">10100000000000000000000</text>
<text x="60" y="244" text-anchor="middle" class="sm">Neg.</text>
<text x="160" y="244" text-anchor="middle" class="sm">e = 2 + 127 = 129</text>
<text x="380" y="244" text-anchor="middle" class="sm">“101” followed by 0s</text>
<text x="280" y="276" text-anchor="middle" class="a">In hex: 0xC0D00000</text>
</svg>
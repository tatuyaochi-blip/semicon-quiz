<text x="290" y="70" text-anchor="start">In each 2×2 block</text>
<text x="290" y="95" text-anchor="start" class="a">2 green, 1 red, 1 blue</text>
<text x="290" y="135" text-anchor="start" class="sm">The eye is most sensitive to green,</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" role="img"><style>:root{--bg:#f5f8fb;--surface:#ffffff;--text:#17212e;--muted:#5a6a7e;--border:#dbe3ec;--accent:#1d64c8;--accent-2:#0b8f72;--accent-soft:#e8f1fd;--ok:#0a8a5f;--ok-bg:#e5f6ef;--ng:#c93a3a;--ng-bg:#fcebeb;--grad:linear-gradient(135deg, #1d64c8, #0b8f72);--shadow:0 1px 2px rgba(20, 40, 70, .06), 0 4px 14px rgba(20, 40, 70, .05);--radius:14px;--fig-n:#d6e6fb;--fig-p:#fde6d4;--fig-ox:#fff1b8;--fig-metal:#c7d0db;--fig-dep:#f1f4f8;--fig-band:#e3ecf7;--fig-ng:#f6c9c9}@media (prefers-color-scheme: dark){:root{--bg:#0d1520;--surface:#152131;--text:#e4ebf3;--muted:#93a3b7;--border:#273649;--accent:#6aa9ff;--accent-2:#3cc9a3;--accent-soft:#1a2c44;--ok:#46d19c;--ok-bg:#12332a;--ng:#ff7b7b;--ng-bg:#3a1e24;--shadow:none;--fig-n:#1d3557;--fig-p:#4a2f22;--fig-ox:#4d4420;--fig-metal:#3a4656;--fig-dep:#1b2533;--fig-band:#1f2d40;--fig-ng:#5a2a2e}}text{font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}text { fill: var(--text); font-size: 15px;  }text.sm { font-size: 13px; }text.m { fill: var(--muted); }text.a { fill: var(--accent); font-weight: 700; }.ln { stroke: var(--text); stroke-width: 2; fill: none; }.thin { stroke: var(--muted); stroke-width: 1.2; fill: none; }.dash { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }.ac { stroke: var(--accent); stroke-width: 3; fill: none; }.ac2 { stroke: var(--accent-2); stroke-width: 3; fill: none; }.ink { fill: var(--text); }.fa { fill: var(--accent); }.fa2 { fill: var(--accent-2); }.hole { fill: var(--surface); stroke: var(--text); stroke-width: 1.5; }.n { fill: var(--fig-n); stroke: var(--muted); }.p { fill: var(--fig-p); stroke: var(--muted); }.ox { fill: var(--fig-ox); stroke: var(--muted); }.metal { fill: var(--fig-metal); stroke: var(--muted); }.dep { fill: var(--fig-dep); stroke: var(--muted); stroke-dasharray: 4 3; }.band { fill: var(--fig-band); }.ng { fill: var(--fig-ng); stroke: var(--muted); }.ok { fill: var(--surface); stroke: var(--muted); }</style><rect width="520" height="250" style="fill:var(--surface)"/>
<title>Cross-sections of isotropic and anisotropic etching</title>
<text x="135" y="20" text-anchor="middle">Isotropic etching</text>
<rect x="30" y="150" width="210" height="30" class="p"/>
<path d="M30,80 H85 Q85,140 135,140 Q185,140 185,80 H240 V150 H30 Z" class="ox"/>
<rect x="30" y="66" width="75" height="14" class="metal"/>
<rect x="165" y="66" width="75" height="14" class="metal"/>
<line x1="135" y1="96" x2="107.4" y2="102.7" class="ac2"/><polygon points="102,104 108,98.9 109.6,105.8" class="fa2"/>
<line x1="135" y1="96" x2="162.6" y2="102.7" class="ac2"/><polygon points="168,104 160.4,105.8 162,98.9" class="fa2"/>
<line x1="135" y1="96" x2="135" y2="122.4" class="ac2"/><polygon points="135,128 131.5,121 138.5,121" class="fa2"/>
<text x="135" y="205" text-anchor="middle" class="sm">Also etches sideways, under the mask</text>
<text x="385" y="20" text-anchor="middle">Anisotropic etching</text>
<rect x="280" y="150" width="210" height="30" class="p"/>
<path d="M280,80 H355 V140 H415 V80 H490 V150 H280 Z" class="ox"/>
<rect x="280" y="66" width="75" height="14" class="metal"/>
<rect x="415" y="66" width="75" height="14" class="metal"/>
<line x1="370" y1="32" x2="370" y2="119.6" class="ac"/><polygon points="370,126 366,118 374,118" class="fa"/>
<line x1="385" y1="32" x2="385" y2="119.6" class="ac"/><polygon points="385,126 381,118 389,118" class="fa"/>
<line x1="400" y1="32" x2="400" y2="119.6" class="ac"/><polygon points="400,126 396,118 404,118" class="fa"/>
<text x="385" y="205" text-anchor="middle" class="sm">Etches only downward; pattern is exact</text>
<rect x="80" y="226" width="16" height="12" class="metal"/>
<text x="102" y="237" text-anchor="start" class="sm">Mask</text>
<rect x="200" y="226" width="16" height="12" class="ox"/>
<text x="222" y="237" text-anchor="start" class="sm">Etched film</text>
<rect x="370" y="226" width="16" height="12" class="p"/>
<text x="392" y="237" text-anchor="start" class="sm">Underlayer</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" role="img"><style>:root{--bg:#f5f8fb;--surface:#ffffff;--text:#17212e;--muted:#5a6a7e;--border:#dbe3ec;--accent:#1d64c8;--accent-2:#0b8f72;--accent-soft:#e8f1fd;--ok:#0a8a5f;--ok-bg:#e5f6ef;--ng:#c93a3a;--ng-bg:#fcebeb;--grad:linear-gradient(135deg, #1d64c8, #0b8f72);--shadow:0 1px 2px rgba(20, 40, 70, .06), 0 4px 14px rgba(20, 40, 70, .05);--radius:14px;--fig-n:#d6e6fb;--fig-p:#fde6d4;--fig-ox:#fff1b8;--fig-metal:#c7d0db;--fig-dep:#f1f4f8;--fig-band:#e3ecf7;--fig-ng:#f6c9c9}@media (prefers-color-scheme: dark){:root{--bg:#0d1520;--surface:#152131;--text:#e4ebf3;--muted:#93a3b7;--border:#273649;--accent:#6aa9ff;--accent-2:#3cc9a3;--accent-soft:#1a2c44;--ok:#46d19c;--ok-bg:#12332a;--ng:#ff7b7b;--ng-bg:#3a1e24;--shadow:none;--fig-n:#1d3557;--fig-p:#4a2f22;--fig-ox:#4d4420;--fig-metal:#3a4656;--fig-dep:#1b2533;--fig-band:#1f2d40;--fig-ng:#5a2a2e}}text{font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}text { fill: var(--text); font-size: 15px;  }text.sm { font-size: 13px; }text.m { fill: var(--muted); }text.a { fill: var(--accent); font-weight: 700; }.ln { stroke: var(--text); stroke-width: 2; fill: none; }.thin { stroke: var(--muted); stroke-width: 1.2; fill: none; }.dash { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }.ac { stroke: var(--accent); stroke-width: 3; fill: none; }.ac2 { stroke: var(--accent-2); stroke-width: 3; fill: none; }.ink { fill: var(--text); }.fa { fill: var(--accent); }.fa2 { fill: var(--accent-2); }.hole { fill: var(--surface); stroke: var(--text); stroke-width: 1.5; }.n { fill: var(--fig-n); stroke: var(--muted); }.p { fill: var(--fig-p); stroke: var(--muted); }.ox { fill: var(--fig-ox); stroke: var(--muted); }.metal { fill: var(--fig-metal); stroke: var(--muted); }.dep { fill: var(--fig-dep); stroke: var(--muted); stroke-dasharray: 4 3; }.band { fill: var(--fig-band); }.ng { fill: var(--fig-ng); stroke: var(--muted); }.ok { fill: var(--surface); stroke: var(--muted); }</style><rect width="520" height="240" style="fill:var(--surface)"/>
<title>平面式電晶體與FinFET的剖面</title>
<text x="130" y="24" text-anchor="middle">平面式</text>
<rect x="30" y="130" width="200" height="70" class="p"/>
<rect x="85" y="118" width="90" height="10" class="ox"/>
<rect x="85" y="80" width="90" height="38" class="metal"/>
<text x="130" y="100" text-anchor="middle" class="sm">閘極</text>
<rect x="90" y="130" width="80" height="6" class="fa"/>
<line x1="130" y1="106" x2="130" y2="122.4" class="ac2"/><polygon points="130,128 126.5,121 133.5,121" class="fa2"/>
<text x="130" y="222" text-anchor="middle" class="sm">閘極僅控制頂面</text>
<text x="390" y="24" text-anchor="middle">FinFET</text>
<rect x="290" y="150" width="200" height="50" class="p"/>
<path d="M340,150 V50 H440 V150 H416 V64 H364 V150 Z" class="metal"/>
<path d="M364,150 V64 H416 V150 H410 V70 H370 V150 Z" class="ox"/>
<rect x="370" y="70" width="40" height="80" class="p"/>
<path d="M370,150 V70 H410 V150" class="ac"/>
<line x1="343" y1="110" x2="360.4" y2="110" class="ac2"/><polygon points="366,110 359,113.5 359,106.5" class="fa2"/>
<line x1="437" y1="110" x2="419.6" y2="110" class="ac2"/><polygon points="414,110 421,106.5 421,113.5" class="fa2"/>
<line x1="390" y1="51" x2="390" y2="61.4" class="ac2"/><polygon points="390,67 386.5,60 393.5,60" class="fa2"/>
<text x="332" y="104" text-anchor="end" class="sm">閘極</text>
<line x1="400" y1="135" x2="455" y2="172" class="thin"/>
<text x="458" y="178" text-anchor="start" class="sm">鰭片</text>
<text x="390" y="222" text-anchor="middle" class="sm">閘極從頂面與兩側面三個方向包圍</text>
</svg>
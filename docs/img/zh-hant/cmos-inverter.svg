<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 280" role="img"><style>:root{--bg:#f5f8fb;--surface:#ffffff;--text:#17212e;--muted:#5a6a7e;--border:#dbe3ec;--accent:#1d64c8;--accent-2:#0b8f72;--accent-soft:#e8f1fd;--ok:#0a8a5f;--ok-bg:#e5f6ef;--ng:#c93a3a;--ng-bg:#fcebeb;--grad:linear-gradient(135deg, #1d64c8, #0b8f72);--shadow:0 1px 2px rgba(20, 40, 70, .06), 0 4px 14px rgba(20, 40, 70, .05);--radius:14px;--fig-n:#d6e6fb;--fig-p:#fde6d4;--fig-ox:#fff1b8;--fig-metal:#c7d0db;--fig-dep:#f1f4f8;--fig-band:#e3ecf7;--fig-ng:#f6c9c9}@media (prefers-color-scheme: dark){:root{--bg:#0d1520;--surface:#152131;--text:#e4ebf3;--muted:#93a3b7;--border:#273649;--accent:#6aa9ff;--accent-2:#3cc9a3;--accent-soft:#1a2c44;--ok:#46d19c;--ok-bg:#12332a;--ng:#ff7b7b;--ng-bg:#3a1e24;--shadow:none;--fig-n:#1d3557;--fig-p:#4a2f22;--fig-ox:#4d4420;--fig-metal:#3a4656;--fig-dep:#1b2533;--fig-band:#1f2d40;--fig-ng:#5a2a2e}}text{font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}text { fill: var(--text); font-size: 15px;  }text.sm { font-size: 13px; }text.m { fill: var(--muted); }text.a { fill: var(--accent); font-weight: 700; }.ln { stroke: var(--text); stroke-width: 2; fill: none; }.thin { stroke: var(--muted); stroke-width: 1.2; fill: none; }.dash { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }.ac { stroke: var(--accent); stroke-width: 3; fill: none; }.ac2 { stroke: var(--accent-2); stroke-width: 3; fill: none; }.ink { fill: var(--text); }.fa { fill: var(--accent); }.fa2 { fill: var(--accent-2); }.hole { fill: var(--surface); stroke: var(--text); stroke-width: 1.5; }.n { fill: var(--fig-n); stroke: var(--muted); }.p { fill: var(--fig-p); stroke: var(--muted); }.ox { fill: var(--fig-ox); stroke: var(--muted); }.metal { fill: var(--fig-metal); stroke: var(--muted); }.dep { fill: var(--fig-dep); stroke: var(--muted); stroke-dasharray: 4 3; }.band { fill: var(--fig-band); }.ng { fill: var(--fig-ng); stroke: var(--muted); }.ok { fill: var(--surface); stroke: var(--muted); }</style><rect width="580" height="280" style="fill:var(--surface)"/>
<title>CMOS反相器</title>
<text x="150" y="28" text-anchor="middle">VDD</text>
<line x1="150" y1="36" x2="150" y2="60" class="ln"/>
<rect x="110" y="60" width="80" height="50" class="p"/>
<text x="150" y="91" text-anchor="middle">pMOS</text>
<line x1="150" y1="110" x2="150" y2="165" class="ln"/>
<circle cx="150" cy="138" r="4" class="ink"/>
<line x1="150" y1="138" x2="250" y2="138" class="ln"/>
<text x="258" y="143" text-anchor="start">輸出</text>
<rect x="110" y="165" width="80" height="50" class="n"/>
<text x="150" y="196" text-anchor="middle">nMOS</text>
<line x1="150" y1="215" x2="150" y2="240" class="ln"/>
<line x1="135" y1="240" x2="165" y2="240" class="ln"/><line x1="141" y1="247" x2="159" y2="247" class="ln"/><line x1="147" y1="254" x2="153" y2="254" class="ln"/>
<text x="178" y="260" text-anchor="start" class="sm m">GND</text>
<line x1="30" y1="138" x2="85" y2="138" class="ln"/>
<circle cx="85" cy="138" r="4" class="ink"/>
<line x1="85" y1="85" x2="85" y2="190" class="ln"/>
<line x1="85" y1="85" x2="110" y2="85" class="ln"/>
<line x1="85" y1="190" x2="110" y2="190" class="ln"/>
<text x="30" y="128" text-anchor="start">輸入</text>
<text x="320" y="70" text-anchor="start">輸入為0時</text>
<text x="320" y="92" text-anchor="start" class="sm">pMOS導通、nMOS截止 → 輸出為1</text>
<text x="320" y="135" text-anchor="start">輸入為1時</text>
<text x="320" y="157" text-anchor="start" class="sm">pMOS截止、nMOS導通 → 輸出為0</text>
<text x="320" y="205" text-anchor="start" class="sm a">無論哪種狀態都有一方截止，</text>
<text x="320" y="225" text-anchor="start" class="sm a">電源到GND幾乎沒有電流流過</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img"><style>:root{--bg:#f5f8fb;--surface:#ffffff;--text:#17212e;--muted:#5a6a7e;--border:#dbe3ec;--accent:#1d64c8;--accent-2:#0b8f72;--accent-soft:#e8f1fd;--ok:#0a8a5f;--ok-bg:#e5f6ef;--ng:#c93a3a;--ng-bg:#fcebeb;--grad:linear-gradient(135deg, #1d64c8, #0b8f72);--shadow:0 1px 2px rgba(20, 40, 70, .06), 0 4px 14px rgba(20, 40, 70, .05);--radius:14px;--fig-n:#d6e6fb;--fig-p:#fde6d4;--fig-ox:#fff1b8;--fig-metal:#c7d0db;--fig-dep:#f1f4f8;--fig-band:#e3ecf7;--fig-ng:#f6c9c9}@media (prefers-color-scheme: dark){:root{--bg:#0d1520;--surface:#152131;--text:#e4ebf3;--muted:#93a3b7;--border:#273649;--accent:#6aa9ff;--accent-2:#3cc9a3;--accent-soft:#1a2c44;--ok:#46d19c;--ok-bg:#12332a;--ng:#ff7b7b;--ng-bg:#3a1e24;--shadow:none;--fig-n:#1d3557;--fig-p:#4a2f22;--fig-ox:#4d4420;--fig-metal:#3a4656;--fig-dep:#1b2533;--fig-band:#1f2d40;--fig-ng:#5a2a2e}}text{font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}text { fill: var(--text); font-size: 15px;  }text.sm { font-size: 13px; }text.m { fill: var(--muted); }text.a { fill: var(--accent); font-weight: 700; }.ln { stroke: var(--text); stroke-width: 2; fill: none; }.thin { stroke: var(--muted); stroke-width: 1.2; fill: none; }.dash { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }.ac { stroke: var(--accent); stroke-width: 3; fill: none; }.ac2 { stroke: var(--accent-2); stroke-width: 3; fill: none; }.ink { fill: var(--text); }.fa { fill: var(--accent); }.fa2 { fill: var(--accent-2); }.hole { fill: var(--surface); stroke: var(--text); stroke-width: 1.5; }.n { fill: var(--fig-n); stroke: var(--muted); }.p { fill: var(--fig-p); stroke: var(--muted); }.ox { fill: var(--fig-ox); stroke: var(--muted); }.metal { fill: var(--fig-metal); stroke: var(--muted); }.dep { fill: var(--fig-dep); stroke: var(--muted); stroke-dasharray: 4 3; }.band { fill: var(--fig-band); }.ng { fill: var(--fig-ng); stroke: var(--muted); }.ok { fill: var(--surface); stroke: var(--muted); }</style><rect width="560" height="320" style="fill:var(--surface)"/>
<title>邏輯準位與雜訊容限</title>
<rect x="110" y="30" width="80" height="35" class="band"/>
<rect x="110" y="65" width="80" height="155" class="dep"/>
<rect x="110" y="220" width="80" height="40" class="band"/>
<text x="150" y="53" text-anchor="middle" class="sm">H輸出</text>
<text x="150" y="245" text-anchor="middle" class="sm">L輸出</text>
<rect x="370" y="30" width="80" height="80" class="band"/>
<rect x="370" y="110" width="80" height="70" class="ng"/>
<rect x="370" y="180" width="80" height="80" class="band"/>
<text x="410" y="75" text-anchor="middle" class="sm">判定為H</text>
<text x="410" y="150" text-anchor="middle" class="sm">不定</text>
<text x="410" y="225" text-anchor="middle" class="sm">判定為L</text>
<text x="102" y="35" text-anchor="end" class="sm m">VDD</text>
<text x="102" y="265" text-anchor="end" class="sm m">0 V</text>
<text x="102" y="70" text-anchor="end" class="sm">VOH(min)</text>
<text x="102" y="225" text-anchor="end" class="sm">VOL(max)</text>
<text x="458" y="115" text-anchor="start" class="sm">VIH(min)</text>
<text x="458" y="185" text-anchor="start" class="sm">VIL(max)</text>
<line x1="190" y1="65" x2="370" y2="65" class="dash"/>
<line x1="190" y1="220" x2="370" y2="220" class="dash"/>
<line x1="190" y1="110" x2="370" y2="110" class="dash"/>
<line x1="190" y1="180" x2="370" y2="180" class="dash"/>
<line x1="280" y1="65" x2="280" y2="110" class="ac"/><line x1="274" y1="65" x2="286" y2="65" class="ac"/><line x1="274" y1="110" x2="286" y2="110" class="ac"/>
<text x="292" y="93" text-anchor="start" class="a">NMH</text>
<line x1="280" y1="180" x2="280" y2="220" class="ac"/><line x1="274" y1="180" x2="286" y2="180" class="ac"/><line x1="274" y1="220" x2="286" y2="220" class="ac"/>
<text x="292" y="205" text-anchor="start" class="a">NML</text>
<text x="150" y="282" text-anchor="middle" class="sm">輸出端保證值</text>
<text x="410" y="282" text-anchor="middle" class="sm">輸入端臨界值</text>
<text x="140" y="308" text-anchor="middle" class="sm a">NMH = VOH(min) − VIH(min)</text>
<text x="420" y="308" text-anchor="middle" class="sm a">NML = VIL(max) − VOL(max)</text>
</svg>
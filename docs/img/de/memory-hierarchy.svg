<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" role="img"><style>:root{--bg:#f5f8fb;--surface:#ffffff;--text:#17212e;--muted:#5a6a7e;--border:#dbe3ec;--accent:#1d64c8;--accent-2:#0b8f72;--accent-soft:#e8f1fd;--ok:#0a8a5f;--ok-bg:#e5f6ef;--ng:#c93a3a;--ng-bg:#fcebeb;--grad:linear-gradient(135deg, #1d64c8, #0b8f72);--shadow:0 1px 2px rgba(20, 40, 70, .06), 0 4px 14px rgba(20, 40, 70, .05);--radius:14px;--fig-n:#d6e6fb;--fig-p:#fde6d4;--fig-ox:#fff1b8;--fig-metal:#c7d0db;--fig-dep:#f1f4f8;--fig-band:#e3ecf7;--fig-ng:#f6c9c9}@media (prefers-color-scheme: dark){:root{--bg:#0d1520;--surface:#152131;--text:#e4ebf3;--muted:#93a3b7;--border:#273649;--accent:#6aa9ff;--accent-2:#3cc9a3;--accent-soft:#1a2c44;--ok:#46d19c;--ok-bg:#12332a;--ng:#ff7b7b;--ng-bg:#3a1e24;--shadow:none;--fig-n:#1d3557;--fig-p:#4a2f22;--fig-ox:#4d4420;--fig-metal:#3a4656;--fig-dep:#1b2533;--fig-band:#1f2d40;--fig-ng:#5a2a2e}}text{font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}text { fill: var(--text); font-size: 15px;  }text.sm { font-size: 13px; }text.m { fill: var(--muted); }text.a { fill: var(--accent); font-weight: 700; }.ln { stroke: var(--text); stroke-width: 2; fill: none; }.thin { stroke: var(--muted); stroke-width: 1.2; fill: none; }.dash { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }.ac { stroke: var(--accent); stroke-width: 3; fill: none; }.ac2 { stroke: var(--accent-2); stroke-width: 3; fill: none; }.ink { fill: var(--text); }.fa { fill: var(--accent); }.fa2 { fill: var(--accent-2); }.hole { fill: var(--surface); stroke: var(--text); stroke-width: 1.5; }.n { fill: var(--fig-n); stroke: var(--muted); }.p { fill: var(--fig-p); stroke: var(--muted); }.ox { fill: var(--fig-ox); stroke: var(--muted); }.metal { fill: var(--fig-metal); stroke: var(--muted); }.dep { fill: var(--fig-dep); stroke: var(--muted); stroke-dasharray: 4 3; }.band { fill: var(--fig-band); }.ng { fill: var(--fig-ng); stroke: var(--muted); }.ok { fill: var(--surface); stroke: var(--muted); }</style><rect width="600" height="290" style="fill:var(--surface)"/>
<title>Speicherhierarchie eines Computers</title>
<text x="300" y="20" text-anchor="middle" class="sm a">Schnell · geringe Kapazität · hohe Kosten pro Bit</text>
<polygon points="280,30 320,30 360,74 240,74" class="band" stroke="currentColor" stroke-opacity=".3"/>
<text x="300" y="58" text-anchor="middle" class="sm">Register</text>
<polygon points="240,74 360,74 400,118 200,118" class="n" stroke="currentColor" stroke-opacity=".3"/>
<text x="300" y="102" text-anchor="middle">L1-Cache</text>
<polygon points="200,118 400,118 440,162 160,162" class="band" stroke="currentColor" stroke-opacity=".3"/>
<text x="300" y="146" text-anchor="middle">L2-/L3-Cache</text>
<polygon points="160,162 440,162 480,206 120,206" class="n" stroke="currentColor" stroke-opacity=".3"/>
<text x="300" y="190" text-anchor="middle">Hauptspeicher (DRAM)</text>
<polygon points="120,206 480,206 520,250 80,250" class="band" stroke="currentColor" stroke-opacity=".3"/>
<text x="300" y="234" text-anchor="middle">Massenspeicher (SSD/HDD)</text>
<text x="300" y="278" text-anchor="middle" class="sm m">Langsam · große Kapazität · niedrige Kosten pro Bit</text>
</svg>
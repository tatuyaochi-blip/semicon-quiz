<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 270" role="img"><style>:root{--bg:#f5f8fb;--surface:#ffffff;--text:#17212e;--muted:#5a6a7e;--border:#dbe3ec;--accent:#1d64c8;--accent-2:#0b8f72;--accent-soft:#e8f1fd;--ok:#0a8a5f;--ok-bg:#e5f6ef;--ng:#c93a3a;--ng-bg:#fcebeb;--grad:linear-gradient(135deg, #1d64c8, #0b8f72);--shadow:0 1px 2px rgba(20, 40, 70, .06), 0 4px 14px rgba(20, 40, 70, .05);--radius:14px;--fig-n:#d6e6fb;--fig-p:#fde6d4;--fig-ox:#fff1b8;--fig-metal:#c7d0db;--fig-dep:#f1f4f8;--fig-band:#e3ecf7;--fig-ng:#f6c9c9}@media (prefers-color-scheme: dark){:root{--bg:#0d1520;--surface:#152131;--text:#e4ebf3;--muted:#93a3b7;--border:#273649;--accent:#6aa9ff;--accent-2:#3cc9a3;--accent-soft:#1a2c44;--ok:#46d19c;--ok-bg:#12332a;--ng:#ff7b7b;--ng-bg:#3a1e24;--shadow:none;--fig-n:#1d3557;--fig-p:#4a2f22;--fig-ox:#4d4420;--fig-metal:#3a4656;--fig-dep:#1b2533;--fig-band:#1f2d40;--fig-ng:#5a2a2e}}text{font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}text { fill: var(--text); font-size: 15px;  }text.sm { font-size: 13px; }text.m { fill: var(--muted); }text.a { fill: var(--accent); font-weight: 700; }.ln { stroke: var(--text); stroke-width: 2; fill: none; }.thin { stroke: var(--muted); stroke-width: 1.2; fill: none; }.dash { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }.ac { stroke: var(--accent); stroke-width: 3; fill: none; }.ac2 { stroke: var(--accent-2); stroke-width: 3; fill: none; }.ink { fill: var(--text); }.fa { fill: var(--accent); }.fa2 { fill: var(--accent-2); }.hole { fill: var(--surface); stroke: var(--text); stroke-width: 1.5; }.n { fill: var(--fig-n); stroke: var(--muted); }.p { fill: var(--fig-p); stroke: var(--muted); }.ox { fill: var(--fig-ox); stroke: var(--muted); }.metal { fill: var(--fig-metal); stroke: var(--muted); }.dep { fill: var(--fig-dep); stroke: var(--muted); stroke-dasharray: 4 3; }.band { fill: var(--fig-band); }.ng { fill: var(--fig-ng); stroke: var(--muted); }.ok { fill: var(--surface); stroke: var(--muted); }</style><rect width="540" height="270" style="fill:var(--surface)"/>
<title>Energiebanddiagramm eines n-Halbleiters</title>
<rect x="50" y="20" width="240" height="40" class="band"/>
<text x="58" y="45" text-anchor="start">Leitungsband</text>
<circle cx="195" cy="51" r="4.5" class="fa"/>
<circle cx="220" cy="51" r="4.5" class="fa"/>
<circle cx="245" cy="51" r="4.5" class="fa"/>
<circle cx="270" cy="51" r="4.5" class="fa"/>
<line x1="50" y1="60" x2="290" y2="60" class="ln"/>
<text x="300" y="65" text-anchor="start">Ec</text>
<line x1="50" y1="90" x2="290" y2="90" class="ac"/>
<text x="300" y="95" text-anchor="start" class="a">EF (Fermi-Niveau)</text>
<line x1="50" y1="140" x2="290" y2="140" class="dash"/>
<text x="300" y="145" text-anchor="start" class="m">Ei (intrinsisches Fermi-Niveau)</text>
<line x1="80" y1="136" x2="80" y2="102.4" class="ac2"/><polygon points="80,96 84,104 76,104" class="fa2"/>
<text x="94" y="122" text-anchor="start" class="sm">Bei Zugabe von Donatoren Verschiebung zum Leitungsband</text>

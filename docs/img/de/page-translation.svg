<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 322" role="img"><style>:root{--bg:#f5f8fb;--surface:#ffffff;--text:#17212e;--muted:#5a6a7e;--border:#dbe3ec;--accent:#1d64c8;--accent-2:#0b8f72;--accent-soft:#e8f1fd;--ok:#0a8a5f;--ok-bg:#e5f6ef;--ng:#c93a3a;--ng-bg:#fcebeb;--grad:linear-gradient(135deg, #1d64c8, #0b8f72);--shadow:0 1px 2px rgba(20, 40, 70, .06), 0 4px 14px rgba(20, 40, 70, .05);--radius:14px;--fig-n:#d6e6fb;--fig-p:#fde6d4;--fig-ox:#fff1b8;--fig-metal:#c7d0db;--fig-dep:#f1f4f8;--fig-band:#e3ecf7;--fig-ng:#f6c9c9}@media (prefers-color-scheme: dark){:root{--bg:#0d1520;--surface:#152131;--text:#e4ebf3;--muted:#93a3b7;--border:#273649;--accent:#6aa9ff;--accent-2:#3cc9a3;--accent-soft:#1a2c44;--ok:#46d19c;--ok-bg:#12332a;--ng:#ff7b7b;--ng-bg:#3a1e24;--shadow:none;--fig-n:#1d3557;--fig-p:#4a2f22;--fig-ox:#4d4420;--fig-metal:#3a4656;--fig-dep:#1b2533;--fig-band:#1f2d40;--fig-ng:#5a2a2e}}text{font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}text { fill: var(--text); font-size: 15px;  }text.sm { font-size: 13px; }text.m { fill: var(--muted); }text.a { fill: var(--accent); font-weight: 700; }.ln { stroke: var(--text); stroke-width: 2; fill: none; }.thin { stroke: var(--muted); stroke-width: 1.2; fill: none; }.dash { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }.ac { stroke: var(--accent); stroke-width: 3; fill: none; }.ac2 { stroke: var(--accent-2); stroke-width: 3; fill: none; }.ink { fill: var(--text); }.fa { fill: var(--accent); }.fa2 { fill: var(--accent-2); }.hole { fill: var(--surface); stroke: var(--text); stroke-width: 1.5; }.n { fill: var(--fig-n); stroke: var(--muted); }.p { fill: var(--fig-p); stroke: var(--muted); }.ox { fill: var(--fig-ox); stroke: var(--muted); }.metal { fill: var(--fig-metal); stroke: var(--muted); }.dep { fill: var(--fig-dep); stroke: var(--muted); stroke-dasharray: 4 3; }.band { fill: var(--fig-band); }.ng { fill: var(--fig-ng); stroke: var(--muted); }.ok { fill: var(--surface); stroke: var(--muted); }</style><rect width="560" height="322" style="fill:var(--surface)"/>
<title>Umsetzung virtuelle → physische Adresse (TLB und Seitentabelle)</title>
<text x="50" y="22" text-anchor="start" class="sm m">Virtuelle Adresse</text>
<rect x="50" y="30" width="280" height="28" class="n"/>
<text x="190" y="49" text-anchor="middle">virt. Seitennummer (VPN)</text>
<rect x="330" y="30" width="190" height="28" class="p"/>
<text x="425" y="49" text-anchor="middle">Seiten-Offset</text>
<rect x="50" y="100" width="160" height="62" rx="8" class="band"/>
<text x="130" y="125" text-anchor="middle">TLB</text>
<text x="130" y="147" text-anchor="middle" class="sm">Übersetzungs-Cache</text>
<line x1="130" y1="58" x2="130" y2="91" class="ln"/><polygon points="130,99 125.5,90 134.5,90" class="ink"/>
<rect x="264" y="100" width="140" height="62" rx="8" class="metal"/>
<text x="334" y="125" text-anchor="middle">Seitentabelle</text>
<text x="334" y="147" text-anchor="middle" class="sm">im Hauptspeicher</text>
<line x1="210" y1="118" x2="256" y2="118" class="ln"/><polygon points="263,118 255,122 255,114" class="ink"/>
<text x="237" y="111" text-anchor="middle" class="sm a">Miss</text>
<line x1="264" y1="146" x2="218" y2="146" class="dash"/><polygon points="211,146 219,142 219,150" class="ink"/>
<text x="237" y="162" text-anchor="middle" class="sm m">Eintrag</text>
<line x1="130" y1="162" x2="130" y2="255" class="ac"/><polygon points="130,263 125.5,254 134.5,254" class="fa"/>
<text x="140" y="216" text-anchor="start" class="sm a">Hit</text>
<line x1="300" y1="162" x2="300" y2="255" class="ln"/><polygon points="300,263 295.5,254 304.5,254" class="ink"/>
<text x="308" y="216" text-anchor="start" class="sm">Page Walk</text>
<line x1="470" y1="58" x2="470" y2="255" class="ac2"/><polygon points="470,263 465.5,254 474.5,254" class="fa2"/>
<text x="478" y="166" text-anchor="start" class="sm a">unverändert</text>
<rect x="50" y="264" width="280" height="28" class="n"/>
<text x="190" y="283" text-anchor="middle">Seitenrahmennr. (PFN)</text>
<rect x="330" y="264" width="190" height="28" class="p"/>
<text x="425" y="283" text-anchor="middle">Seiten-Offset</text>
<text x="50" y="312" text-anchor="start" class="sm m">Physische Adresse</text>
<text x="520" y="312" text-anchor="end" class="sm m">Bei 4-KB-Seiten: Offset = untere 12 Bit</text>
</svg>
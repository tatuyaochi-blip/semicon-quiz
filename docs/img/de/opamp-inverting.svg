<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 245" role="img"><style>:root{--bg:#f5f8fb;--surface:#ffffff;--text:#17212e;--muted:#5a6a7e;--border:#dbe3ec;--accent:#1d64c8;--accent-2:#0b8f72;--accent-soft:#e8f1fd;--ok:#0a8a5f;--ok-bg:#e5f6ef;--ng:#c93a3a;--ng-bg:#fcebeb;--grad:linear-gradient(135deg, #1d64c8, #0b8f72);--shadow:0 1px 2px rgba(20, 40, 70, .06), 0 4px 14px rgba(20, 40, 70, .05);--radius:14px;--fig-n:#d6e6fb;--fig-p:#fde6d4;--fig-ox:#fff1b8;--fig-metal:#c7d0db;--fig-dep:#f1f4f8;--fig-band:#e3ecf7;--fig-ng:#f6c9c9}@media (prefers-color-scheme: dark){:root{--bg:#0d1520;--surface:#152131;--text:#e4ebf3;--muted:#93a3b7;--border:#273649;--accent:#6aa9ff;--accent-2:#3cc9a3;--accent-soft:#1a2c44;--ok:#46d19c;--ok-bg:#12332a;--ng:#ff7b7b;--ng-bg:#3a1e24;--shadow:none;--fig-n:#1d3557;--fig-p:#4a2f22;--fig-ox:#4d4420;--fig-metal:#3a4656;--fig-dep:#1b2533;--fig-band:#1f2d40;--fig-ng:#5a2a2e}}text{font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}text { fill: var(--text); font-size: 15px;  }text.sm { font-size: 13px; }text.m { fill: var(--muted); }text.a { fill: var(--accent); font-weight: 700; }.ln { stroke: var(--text); stroke-width: 2; fill: none; }.thin { stroke: var(--muted); stroke-width: 1.2; fill: none; }.dash { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }.ac { stroke: var(--accent); stroke-width: 3; fill: none; }.ac2 { stroke: var(--accent-2); stroke-width: 3; fill: none; }.ink { fill: var(--text); }.fa { fill: var(--accent); }.fa2 { fill: var(--accent-2); }.hole { fill: var(--surface); stroke: var(--text); stroke-width: 1.5; }.n { fill: var(--fig-n); stroke: var(--muted); }.p { fill: var(--fig-p); stroke: var(--muted); }.ox { fill: var(--fig-ox); stroke: var(--muted); }.metal { fill: var(--fig-metal); stroke: var(--muted); }.dep { fill: var(--fig-dep); stroke: var(--muted); stroke-dasharray: 4 3; }.band { fill: var(--fig-band); }.ng { fill: var(--fig-ng); stroke: var(--muted); }.ok { fill: var(--surface); stroke: var(--muted); }</style><rect width="560" height="245" style="fill:var(--surface)"/>
<title>Invertierende Verstärkerschaltung mit Operationsverstärker</title>
<polygon points="260,70 260,170 360,120" class="ok"/>
<text x="272" y="101" text-anchor="start" class="m">−</text>
<text x="272" y="151" text-anchor="start" class="m">+</text>
<text x="22" y="100" text-anchor="start">Vin</text>
<line x1="55" y1="95" x2="100" y2="95" class="ln"/>
<rect x="100" y="85" width="60" height="20" class="ok"/>
<text x="130" y="78" text-anchor="middle" class="sm">Ri</text>
<line x1="160" y1="95" x2="260" y2="95" class="ln"/>
<circle cx="210" cy="95" r="4" class="ink"/>
<line x1="210" y1="95" x2="210" y2="40" class="ln"/>
<line x1="210" y1="40" x2="260" y2="40" class="ln"/>
<rect x="260" y="30" width="60" height="20" class="ok"/>
<text x="290" y="23" text-anchor="middle" class="sm">Rf</text>
<line x1="320" y1="40" x2="400" y2="40" class="ln"/>
<line x1="400" y1="40" x2="400" y2="120" class="ln"/>
<line x1="360" y1="120" x2="450" y2="120" class="ln"/>
<circle cx="400" cy="120" r="4" class="ink"/>
<text x="458" y="125" text-anchor="start">Vout</text>
<line x1="260" y1="145" x2="230" y2="145" class="ln"/>
<line x1="230" y1="145" x2="230" y2="190" class="ln"/>
<line x1="215" y1="190" x2="245" y2="190" class="ln"/><line x1="221" y1="197" x2="239" y2="197" class="ln"/><line x1="227" y1="204" x2="233" y2="204" class="ln"/>
<text x="300" y="205" text-anchor="start" class="a">Vout = −(Rf / Ri) × Vin</text>
<text x="300" y="228" text-anchor="start" class="sm m">Durch den virtuellen Kurzschluss liegt der −Eingang nahezu auf 0 V</text>
</svg>
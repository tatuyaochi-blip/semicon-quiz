<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" role="img"><style>:root{--bg:#f5f8fb;--surface:#ffffff;--text:#17212e;--muted:#5a6a7e;--border:#dbe3ec;--accent:#1d64c8;--accent-2:#0b8f72;--accent-soft:#e8f1fd;--ok:#0a8a5f;--ok-bg:#e5f6ef;--ng:#c93a3a;--ng-bg:#fcebeb;--grad:linear-gradient(135deg, #1d64c8, #0b8f72);--shadow:0 1px 2px rgba(20, 40, 70, .06), 0 4px 14px rgba(20, 40, 70, .05);--radius:14px;--fig-n:#d6e6fb;--fig-p:#fde6d4;--fig-ox:#fff1b8;--fig-metal:#c7d0db;--fig-dep:#f1f4f8;--fig-band:#e3ecf7;--fig-ng:#f6c9c9}@media (prefers-color-scheme: dark){:root{--bg:#0d1520;--surface:#152131;--text:#e4ebf3;--muted:#93a3b7;--border:#273649;--accent:#6aa9ff;--accent-2:#3cc9a3;--accent-soft:#1a2c44;--ok:#46d19c;--ok-bg:#12332a;--ng:#ff7b7b;--ng-bg:#3a1e24;--shadow:none;--fig-n:#1d3557;--fig-p:#4a2f22;--fig-ox:#4d4420;--fig-metal:#3a4656;--fig-dep:#1b2533;--fig-band:#1f2d40;--fig-ng:#5a2a2e}}text{font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}text { fill: var(--text); font-size: 15px;  }text.sm { font-size: 13px; }text.m { fill: var(--muted); }text.a { fill: var(--accent); font-weight: 700; }.ln { stroke: var(--text); stroke-width: 2; fill: none; }.thin { stroke: var(--muted); stroke-width: 1.2; fill: none; }.dash { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }.ac { stroke: var(--accent); stroke-width: 3; fill: none; }.ac2 { stroke: var(--accent-2); stroke-width: 3; fill: none; }.ink { fill: var(--text); }.fa { fill: var(--accent); }.fa2 { fill: var(--accent-2); }.hole { fill: var(--surface); stroke: var(--text); stroke-width: 1.5; }.n { fill: var(--fig-n); stroke: var(--muted); }.p { fill: var(--fig-p); stroke: var(--muted); }.ox { fill: var(--fig-ox); stroke: var(--muted); }.metal { fill: var(--fig-metal); stroke: var(--muted); }.dep { fill: var(--fig-dep); stroke: var(--muted); stroke-dasharray: 4 3; }.band { fill: var(--fig-band); }.ng { fill: var(--fig-ng); stroke: var(--muted); }.ok { fill: var(--surface); stroke: var(--muted); }</style><rect width="600" height="240" style="fill:var(--surface)"/>
<title>NAND型フラッシュのセルの並び（ストリング）</title>
<line x1="40" y1="110" x2="545" y2="110" class="ln"/>
<rect x="90" y="88" width="50" height="44" rx="6" class="metal"/>
<text x="115" y="116" text-anchor="middle" class="sm">選択</text>
<rect x="165" y="88" width="55" height="44" rx="6" class="n"/>
<text x="192" y="116" text-anchor="middle" class="sm">WL0</text>
<rect x="235" y="88" width="55" height="44" rx="6" class="n"/>
<text x="262" y="116" text-anchor="middle" class="sm">WL1</text>
<rect x="305" y="88" width="55" height="44" rx="6" class="n"/>
<text x="332" y="116" text-anchor="middle" class="sm">WL2</text>
<rect x="375" y="88" width="55" height="44" rx="6" class="n"/>
<text x="402" y="116" text-anchor="middle" class="sm">WL3</text>
<rect x="450" y="88" width="50" height="44" rx="6" class="metal"/>
<text x="475" y="116" text-anchor="middle" class="sm">選択</text>
<text x="40" y="80" text-anchor="start" class="sm">ビット線へ</text>
<text x="550" y="80" text-anchor="end" class="sm">ソース線へ</text>
<line x1="165" y1="148" x2="430" y2="148" class="thin"/>
<line x1="165" y1="142" x2="165" y2="154" class="thin"/>
<line x1="430" y1="142" x2="430" y2="154" class="thin"/>
<text x="297" y="172" text-anchor="middle" class="sm a">メモリセルを直列につなぐ</text>
<text x="300" y="205" text-anchor="middle" class="sm">NAND型：コンタクトが少なく高集積。読み出しはページ単位</text>
<text x="300" y="228" text-anchor="middle" class="sm m">NOR型：セルを並列につなぎ、1個ずつ直接読めるが面積が大きい</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 215" role="img"><style>:root{--bg:#f5f8fb;--surface:#ffffff;--text:#17212e;--muted:#5a6a7e;--border:#dbe3ec;--accent:#1d64c8;--accent-2:#0b8f72;--accent-soft:#e8f1fd;--ok:#0a8a5f;--ok-bg:#e5f6ef;--ng:#c93a3a;--ng-bg:#fcebeb;--grad:linear-gradient(135deg, #1d64c8, #0b8f72);--shadow:0 1px 2px rgba(20, 40, 70, .06), 0 4px 14px rgba(20, 40, 70, .05);--radius:14px;--fig-n:#d6e6fb;--fig-p:#fde6d4;--fig-ox:#fff1b8;--fig-metal:#c7d0db;--fig-dep:#f1f4f8;--fig-band:#e3ecf7;--fig-ng:#f6c9c9}@media (prefers-color-scheme: dark){:root{--bg:#0d1520;--surface:#152131;--text:#e4ebf3;--muted:#93a3b7;--border:#273649;--accent:#6aa9ff;--accent-2:#3cc9a3;--accent-soft:#1a2c44;--ok:#46d19c;--ok-bg:#12332a;--ng:#ff7b7b;--ng-bg:#3a1e24;--shadow:none;--fig-n:#1d3557;--fig-p:#4a2f22;--fig-ox:#4d4420;--fig-metal:#3a4656;--fig-dep:#1b2533;--fig-band:#1f2d40;--fig-ng:#5a2a2e}}text{font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}text { fill: var(--text); font-size: 15px;  }text.sm { font-size: 13px; }text.m { fill: var(--muted); }text.a { fill: var(--accent); font-weight: 700; }.ln { stroke: var(--text); stroke-width: 2; fill: none; }.thin { stroke: var(--muted); stroke-width: 1.2; fill: none; }.dash { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }.ac { stroke: var(--accent); stroke-width: 3; fill: none; }.ac2 { stroke: var(--accent-2); stroke-width: 3; fill: none; }.ink { fill: var(--text); }.fa { fill: var(--accent); }.fa2 { fill: var(--accent-2); }.hole { fill: var(--surface); stroke: var(--text); stroke-width: 1.5; }.n { fill: var(--fig-n); stroke: var(--muted); }.p { fill: var(--fig-p); stroke: var(--muted); }.ox { fill: var(--fig-ox); stroke: var(--muted); }.metal { fill: var(--fig-metal); stroke: var(--muted); }.dep { fill: var(--fig-dep); stroke: var(--muted); stroke-dasharray: 4 3; }.band { fill: var(--fig-band); }.ng { fill: var(--fig-ng); stroke: var(--muted); }.ok { fill: var(--surface); stroke: var(--muted); }</style><rect width="610" height="215" style="fill:var(--surface)"/>
<title>ダマシン法による銅配線の形成</title>
<rect x="15" y="14" width="12" height="12" class="ox"/>
<text x="32" y="25" text-anchor="start" class="sm">絶縁膜</text>
<line x1="100" y1="20" x2="116" y2="20" class="ac2"/>
<text x="122" y="25" text-anchor="start" class="sm">バリア・シード層</text>
<rect x="250" y="14" width="12" height="12" class="ng"/>
<text x="267" y="25" text-anchor="start" class="sm">銅</text>
<path d="M15,90 H60 V130 H100 V90 H145 V160 H15 Z" class="ox"/>
<path d="M163,90 H208 V130 H248 V90 H293 V160 H163 Z" class="ox"/>
<polyline points="163,90 208,90 208,130 248,130 248,90 293,90" class="ac2"/>
<path d="M311,90 H356 V130 H396 V90 H441 V160 H311 Z" class="ox"/>
<path d="M311,90 H356 V130 H396 V90 H441 V68 H311 Z" class="ng"/>
<polyline points="311,90 356,90 356,130 396,130 396,90 441,90" class="ac2"/>
<path d="M459,90 H504 V130 H544 V90 H589 V160 H459 Z" class="ox"/>
<rect x="504" y="90" width="40" height="40" class="ng"/>
<polyline points="504,90 504,130 544,130 544,90" class="ac2"/>
<text x="80" y="190" text-anchor="middle" class="sm">① 溝を掘る</text>
<text x="228" y="190" text-anchor="middle" class="sm">② バリア・シード</text>
<text x="376" y="190" text-anchor="middle" class="sm">③ 銅をめっき</text>
<text x="524" y="190" text-anchor="middle" class="sm">④ CMPで平坦化</text>
</svg>
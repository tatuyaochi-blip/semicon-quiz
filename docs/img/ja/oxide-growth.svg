<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" role="img"><style>:root{--bg:#f5f8fb;--surface:#ffffff;--text:#17212e;--muted:#5a6a7e;--border:#dbe3ec;--accent:#1d64c8;--accent-2:#0b8f72;--accent-soft:#e8f1fd;--ok:#0a8a5f;--ok-bg:#e5f6ef;--ng:#c93a3a;--ng-bg:#fcebeb;--grad:linear-gradient(135deg, #1d64c8, #0b8f72);--shadow:0 1px 2px rgba(20, 40, 70, .06), 0 4px 14px rgba(20, 40, 70, .05);--radius:14px;--fig-n:#d6e6fb;--fig-p:#fde6d4;--fig-ox:#fff1b8;--fig-metal:#c7d0db;--fig-dep:#f1f4f8;--fig-band:#e3ecf7;--fig-ng:#f6c9c9}@media (prefers-color-scheme: dark){:root{--bg:#0d1520;--surface:#152131;--text:#e4ebf3;--muted:#93a3b7;--border:#273649;--accent:#6aa9ff;--accent-2:#3cc9a3;--accent-soft:#1a2c44;--ok:#46d19c;--ok-bg:#12332a;--ng:#ff7b7b;--ng-bg:#3a1e24;--shadow:none;--fig-n:#1d3557;--fig-p:#4a2f22;--fig-ox:#4d4420;--fig-metal:#3a4656;--fig-dep:#1b2533;--fig-band:#1f2d40;--fig-ng:#5a2a2e}}text{font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}text { fill: var(--text); font-size: 15px;  }text.sm { font-size: 13px; }text.m { fill: var(--muted); }text.a { fill: var(--accent); font-weight: 700; }.ln { stroke: var(--text); stroke-width: 2; fill: none; }.thin { stroke: var(--muted); stroke-width: 1.2; fill: none; }.dash { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }.ac { stroke: var(--accent); stroke-width: 3; fill: none; }.ac2 { stroke: var(--accent-2); stroke-width: 3; fill: none; }.ink { fill: var(--text); }.fa { fill: var(--accent); }.fa2 { fill: var(--accent-2); }.hole { fill: var(--surface); stroke: var(--text); stroke-width: 1.5; }.n { fill: var(--fig-n); stroke: var(--muted); }.p { fill: var(--fig-p); stroke: var(--muted); }.ox { fill: var(--fig-ox); stroke: var(--muted); }.metal { fill: var(--fig-metal); stroke: var(--muted); }.dep { fill: var(--fig-dep); stroke: var(--muted); stroke-dasharray: 4 3; }.band { fill: var(--fig-band); }.ng { fill: var(--fig-ng); stroke: var(--muted); }.ok { fill: var(--surface); stroke: var(--muted); }</style><rect width="600" height="270" style="fill:var(--surface)"/>
<title>熱酸化による酸化膜の成長</title>
<text x="130" y="55" text-anchor="middle">酸化前</text>
<rect x="40" y="120" width="180" height="110" class="p"/>
<text x="130" y="180" text-anchor="middle">シリコン</text>
<text x="390" y="55" text-anchor="middle">酸化後</text>
<rect x="300" y="70" width="180" height="90" class="ox"/>
<text x="390" y="112" text-anchor="middle">SiO₂（厚さ x）</text>
<rect x="300" y="160" width="180" height="70" class="p"/>
<text x="390" y="200" text-anchor="middle">シリコン</text>
<line x1="30" y1="120" x2="490" y2="120" class="dash"/>
<text x="292" y="114" text-anchor="end" class="sm m">元の表面</text>
<line x1="492" y1="70" x2="492" y2="160" class="thin"/>
<line x1="486" y1="70" x2="498" y2="70" class="thin"/>
<line x1="486" y1="120" x2="498" y2="120" class="thin"/>
<line x1="486" y1="160" x2="498" y2="160" class="thin"/>
<text x="504" y="100" text-anchor="start" class="sm">約0.56x</text>
<text x="504" y="145" text-anchor="start" class="sm a">約0.44x</text>
<text x="300" y="258" text-anchor="middle" class="sm a">酸化膜の厚さの約44%は、もとのシリコンを消費した分</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" role="img"><style>:root{--bg:#f5f8fb;--surface:#ffffff;--text:#17212e;--muted:#5a6a7e;--border:#dbe3ec;--accent:#1d64c8;--accent-2:#0b8f72;--accent-soft:#e8f1fd;--ok:#0a8a5f;--ok-bg:#e5f6ef;--ng:#c93a3a;--ng-bg:#fcebeb;--grad:linear-gradient(135deg, #1d64c8, #0b8f72);--shadow:0 1px 2px rgba(20, 40, 70, .06), 0 4px 14px rgba(20, 40, 70, .05);--radius:14px;--fig-n:#d6e6fb;--fig-p:#fde6d4;--fig-ox:#fff1b8;--fig-metal:#c7d0db;--fig-dep:#f1f4f8;--fig-band:#e3ecf7;--fig-ng:#f6c9c9}@media (prefers-color-scheme: dark){:root{--bg:#0d1520;--surface:#152131;--text:#e4ebf3;--muted:#93a3b7;--border:#273649;--accent:#6aa9ff;--accent-2:#3cc9a3;--accent-soft:#1a2c44;--ok:#46d19c;--ok-bg:#12332a;--ng:#ff7b7b;--ng-bg:#3a1e24;--shadow:none;--fig-n:#1d3557;--fig-p:#4a2f22;--fig-ox:#4d4420;--fig-metal:#3a4656;--fig-dep:#1b2533;--fig-band:#1f2d40;--fig-ng:#5a2a2e}}text{font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}text { fill: var(--text); font-size: 15px;  }text.sm { font-size: 13px; }text.m { fill: var(--muted); }text.a { fill: var(--accent); font-weight: 700; }.ln { stroke: var(--text); stroke-width: 2; fill: none; }.thin { stroke: var(--muted); stroke-width: 1.2; fill: none; }.dash { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }.ac { stroke: var(--accent); stroke-width: 3; fill: none; }.ac2 { stroke: var(--accent-2); stroke-width: 3; fill: none; }.ink { fill: var(--text); }.fa { fill: var(--accent); }.fa2 { fill: var(--accent-2); }.hole { fill: var(--surface); stroke: var(--text); stroke-width: 1.5; }.n { fill: var(--fig-n); stroke: var(--muted); }.p { fill: var(--fig-p); stroke: var(--muted); }.ox { fill: var(--fig-ox); stroke: var(--muted); }.metal { fill: var(--fig-metal); stroke: var(--muted); }.dep { fill: var(--fig-dep); stroke: var(--muted); stroke-dasharray: 4 3; }.band { fill: var(--fig-band); }.ng { fill: var(--fig-ng); stroke: var(--muted); }.ok { fill: var(--surface); stroke: var(--muted); }</style><rect width="540" height="300" style="fill:var(--surface)"/>
<title>CZ法（チョクラルスキー法）による単結晶の引き上げ</title>
<line x1="260" y1="22" x2="260" y2="70" class="ln"/>
<polygon points="260,12 255,21 265,21" class="ink"/>
<text x="278" y="40" text-anchor="start" class="sm">回転させながら引き上げる</text>
<rect x="253" y="70" width="14" height="14" class="metal"/>
<text x="276" y="82" text-anchor="start" class="sm">種結晶</text>
<rect x="257" y="84" width="6" height="14" class="band" stroke="currentColor" stroke-opacity=".4"/>
<path d="M257,98 L232,122 L232,195 L288,195 L288,122 L263,98 Z" class="band" stroke="currentColor" stroke-opacity=".4"/>
<text x="260" y="160" text-anchor="middle" class="sm">単結晶</text>
<rect x="172" y="195" width="176" height="47" class="ox"/>
<text x="260" y="225" text-anchor="middle" class="sm">シリコン融液</text>
<path d="M164,165 V250 H356 V165" class="ln"/>
<text x="260" y="275" text-anchor="middle" class="sm">石英るつぼ</text>
<rect x="132" y="170" width="14" height="80" class="ng"/>
<rect x="374" y="170" width="14" height="80" class="ng"/>
<text x="398" y="214" text-anchor="start" class="sm">ヒーター</text>
</svg>
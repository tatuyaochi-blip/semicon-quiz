<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 338" role="img"><style>:root{--bg:#f5f8fb;--surface:#ffffff;--text:#17212e;--muted:#5a6a7e;--border:#dbe3ec;--accent:#1d64c8;--accent-2:#0b8f72;--accent-soft:#e8f1fd;--ok:#0a8a5f;--ok-bg:#e5f6ef;--ng:#c93a3a;--ng-bg:#fcebeb;--grad:linear-gradient(135deg, #1d64c8, #0b8f72);--shadow:0 1px 2px rgba(20, 40, 70, .06), 0 4px 14px rgba(20, 40, 70, .05);--radius:14px;--fig-n:#d6e6fb;--fig-p:#fde6d4;--fig-ox:#fff1b8;--fig-metal:#c7d0db;--fig-dep:#f1f4f8;--fig-band:#e3ecf7;--fig-ng:#f6c9c9}@media (prefers-color-scheme: dark){:root{--bg:#0d1520;--surface:#152131;--text:#e4ebf3;--muted:#93a3b7;--border:#273649;--accent:#6aa9ff;--accent-2:#3cc9a3;--accent-soft:#1a2c44;--ok:#46d19c;--ok-bg:#12332a;--ng:#ff7b7b;--ng-bg:#3a1e24;--shadow:none;--fig-n:#1d3557;--fig-p:#4a2f22;--fig-ox:#4d4420;--fig-metal:#3a4656;--fig-dep:#1b2533;--fig-band:#1f2d40;--fig-ng:#5a2a2e}}text{font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}text { fill: var(--text); font-size: 15px;  }text.sm { font-size: 13px; }text.m { fill: var(--muted); }text.a { fill: var(--accent); font-weight: 700; }.ln { stroke: var(--text); stroke-width: 2; fill: none; }.thin { stroke: var(--muted); stroke-width: 1.2; fill: none; }.dash { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }.ac { stroke: var(--accent); stroke-width: 3; fill: none; }.ac2 { stroke: var(--accent-2); stroke-width: 3; fill: none; }.ink { fill: var(--text); }.fa { fill: var(--accent); }.fa2 { fill: var(--accent-2); }.hole { fill: var(--surface); stroke: var(--text); stroke-width: 1.5; }.n { fill: var(--fig-n); stroke: var(--muted); }.p { fill: var(--fig-p); stroke: var(--muted); }.ox { fill: var(--fig-ox); stroke: var(--muted); }.metal { fill: var(--fig-metal); stroke: var(--muted); }.dep { fill: var(--fig-dep); stroke: var(--muted); stroke-dasharray: 4 3; }.band { fill: var(--fig-band); }.ng { fill: var(--fig-ng); stroke: var(--muted); }.ok { fill: var(--surface); stroke: var(--muted); }</style><rect width="560" height="338" style="fill:var(--surface)"/>
<title>逐次比較型（SAR型）ADコンバータ</title>
<text x="20" y="82" text-anchor="start">Vin</text>
<line x1="48" y1="77" x2="62" y2="77" class="ln"/><polygon points="70,77 62,81 62,73" class="ink"/>
<rect x="70" y="57" width="112" height="40" class="ok"/>
<text x="126" y="82" text-anchor="middle" class="sm">サンプルホールド</text>
<path d="M182,77 L205,77 L205,57 L225,57" class="ln"/>
<polygon points="225,40 225,110 285,75" class="ok"/>
<text x="233" y="62" text-anchor="middle" class="sm m">+</text>
<text x="233" y="98" text-anchor="middle" class="sm m">−</text>
<text x="255" y="32" text-anchor="middle" class="sm">比較器</text>
<line x1="285" y1="75" x2="312" y2="75" class="ln"/><polygon points="320,75 312,79 312,71" class="ink"/>
<rect x="320" y="55" width="105" height="40" class="ok"/>
<text x="372" y="80" text-anchor="middle" class="sm">SARロジック</text>
<line x1="425" y1="75" x2="497" y2="75" class="ln"/><polygon points="505,75 497,79 497,71" class="ink"/>
<text x="465" y="66" text-anchor="middle" class="sm">デジタル出力</text>
<line x1="372" y1="95" x2="372" y2="107" class="ln"/><polygon points="372,115 368,107 376,107" class="ink"/>
<text x="380" y="110" text-anchor="start" class="sm m">試し値</text>
<rect x="320" y="115" width="105" height="30" class="ok"/>
<text x="372" y="135" text-anchor="middle" class="sm">DAC</text>
<path d="M320,130 L212,130 L212,93 L218,93" class="ln"/><polygon points="225,93 218,96.5 218,89.5" class="ink"/>
<text x="265" y="148" text-anchor="middle" class="sm m">比較用の電圧</text>
<line x1="70" y1="310" x2="70" y2="176" class="ln"/><polygon points="70,168 74,176 66,176" class="ink"/>
<line x1="70" y1="310" x2="330" y2="310" class="ln"/>
<text x="78" y="176" text-anchor="start" class="sm m">DACの出力</text>
<line x1="66" y1="185" x2="74" y2="185" class="thin"/>
<text x="62" y="190" text-anchor="end" class="sm m">FS</text>
<text x="62" y="315" text-anchor="end" class="sm m">0</text>
<line x1="70" y1="228" x2="330" y2="228" class="dash"/>
<text x="336" y="233" text-anchor="start" class="sm">Vin</text>
<path d="M80,247.5 H140 V216.3 H200 V231.9 H260 V224.1 H320" class="ac"/>
<text x="110" y="330" text-anchor="middle" class="sm a">1</text>
<text x="170" y="330" text-anchor="middle" class="sm a">0</text>
<text x="230" y="330" text-anchor="middle" class="sm a">1</text>
<text x="290" y="330" text-anchor="middle" class="sm a">0</text>
<text x="340" y="330" text-anchor="start" class="sm m">判定結果</text>
<text x="372" y="200" text-anchor="start" class="sm a">上位ビットから順に決める</text>
<text x="372" y="224" text-anchor="start" class="sm">Vin ≥ DAC → 1を残す</text>
<text x="372" y="246" text-anchor="start" class="sm">Vin &lt; DAC → 0に戻す</text>
<text x="372" y="270" text-anchor="start" class="sm">Nビットなら比較はN回</text>
<text x="372" y="294" text-anchor="start" class="sm m">例：4ビットで1010</text>
</svg>